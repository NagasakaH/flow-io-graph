    // ガターが詰まるとき扇の最低目盛 3px が隣のレーンの通路を食って
    // 外側レーンと同じ x に潰れる。この領域では扇をピッチの正確な半分へ
    // 縮める。(レーン, 扇) の組合せの連番が違えば x も違う
    var fanStep = pitch < 6 ? pitch / 2
      : Math.min(fanPitch, Math.max(3, pitch / 2 - 1));
    var depth = base + ch * pitch + f * fanStep;

    // ゲートウェイ同士の前方分岐: 下頂点から上頂点への短い垂直下降。
    // 同じ頂点に複数集まると 1 本に潰えて別条件が見えないので、辺に沿って左右へ刻む。
    if (o.vert && !o.exitOver) {
      // ゲートウェイ同士の前方分岐: 垂直下降。発は下辺・着は上辺を同じ目盛で刻む
      // （顔スロット登記）。同宛先の条件違いも始点・終点とも左右に並列分散し、
      // 重ならず交差せず、列間隔は矢じり幅より広く保つ。
      var gs2 = o.gslot || 0;
      var ax2 = acx + gs2;
      var ay2 = ab - Math.min(ah / 2, Math.abs(gs2) * (ah / aw));
      var bx2 = bcx + gs2;
      var by2 = bt + Math.min(bh / 2, Math.abs(gs2) * (bh / bw));
      var dv = Math.max(9, Math.min(30, (by2 - ay2) * 0.4));
      return {
        d: "M" + ax2 + "," + ay2 + " C" + ax2 + "," + (ay2 + dv) + " " + bx2 + "," + (by2 - dv) + " " + bx2 + "," + by2,
        tan: 90, face: "down", keepX: true, end: false,
        lx: Math.max(ax2, bx2) + 8, ly: (ay2 + by2) / 2 + (gs2 > 0 ? 13 : gs2 < 0 ? -13 : 0),
      };
    }

    // 隣接行への前方縁は中央をまっすぐ下ろす。ガターまで横に振ると、同じ出所から
    // 出る遠い縁と分岐直下で重なる（s116→s117 と s116→s119 が 22 セル重畳）。
    // ただし宛先がひし形（ゲートウェイ）のときは使わない。頂点へ刻んで入る通常の
    // ゲートウェイ経路に比べ、中央直下は条件ラベル（頂点の上に出る）と終端が同じ柱に
    // 重なる（合成検査 s2→s3 の「経路B」ラベルに矢印が刺さる）。
    if (o.near && !up && !o.self && !o.dstGw && !o.exitOver) {
      // 出所がひし形（ゲートウェイ）のとき、着地を中央（＝下頂点と同じ列）に
      // 置くと、同じ頂点から降りる回り込み縁の縦線と同じ列に重なる。360px 実測:
      // s084 のドロップ（出口を扇で −11 に刻み、中央 bcx へ曲線で戻る）が
      // 頂点列 x538 に到達する高さと、回り込みの降り区間が重なり 10px 並走した
      // （s084/s100/s112/s116 の 4 組）。頂点列から左へ退避させる
      var nxS = bcx + arrOff - (o.srcGw ? 16 : 0);
      var ndv = Math.max(9, Math.min(26, (bt - ab) * 0.45));
      // 出口は顔スロット登記どおりひし形の下辺に沿って刻む（頂点共有はやめた。
      // 同じ点から複数の矢印が出ると出所を辿れない）。着地は宛先側ファンで刻み、
      // 頂列とは 16px 退避させて回り込み縁の縦線と列を重ねない。
      var gs = o.srcGw ? (o.gslot || 0) : 0;
      var aby = ab - Math.min(ah / 2, Math.abs(gs) * (ah / aw));
      var nsx = acx + gs;
      var nOcc = o.outCount || 0;
      // 刻みは角丸カードだけ。ひし形の中央目盛（gslot が 0）は「未刻み」とは
      // 違うので二重に刻まない（実測: 中央出口が 0+11 に押されて辺から浮いた）
      if (!o.srcGw && nOcc > 1) nsx += ((o.outI || 0) - (nOcc - 1) / 2) * Math.max(14, Math.min(22, (aw - 16) / (nOcc - 1)));
      var ncx = nsx, ncy = aby + ndv;
      return {
        d: "M" + nsx + "," + aby + " C" + ncx + "," + ncy + " " + nxS + "," + (bt - ndv) + " " + nxS + "," + bt,
        tan: 90, face: "down", keepX: true, end: true, lx: Math.min(nsx, ncx, nxS) - 8, ly: (ab + bt) / 2,
      };
    }

    // 展開中の行をまたぐ長い縁: サイド列を回り込み、宛先行の下の空き帯から下面へ
    // 進入する。通路はサイド列の外側の余白（左右）。サイド列との 20px 通路に詰め
    // ると縦線が同じ x に潰れ（実測 parallel 202）、帯を貫けばサイドカードを刺す
    // （実測 pierce 6）。空き帯は行の幅ぶん全幅に空いている唯一の通路。
    if (open && !o.self && !o.vert && !o.near && o.srcRowB != null && o.dstRowB != null) {
      var rBotS = o.srcRowB, rBotT = o.dstRowB;
      if (up) {
        if (!o.vert) {
          var kN = Math.max(1, o.laneCountBack || 1);
          var kIdx = o.chanBack || 0;
          var gxKB = sideLeftMin === null ? 10 : sideLeftMin - 14;
          var kPitch = kN > 1 ? Math.max(4, Math.min(12, (gxKB - 10) / (kN - 1))) : 12;
          var gxK = Math.max(10, gxKB - kIdx * kPitch);
          var xd = leftBound === null ? (ax - 12) : (leftBound + ax) / 2;
          var kY = rBotT + 14 + (kN - 1 - kIdx) * 16;
          // 退回縁の下面進入は行下帯から縦に上がる。着地点は顔スロット登記が
          // 宛先ひし形の下辺の外側目盛へ刻む（出口の降り線と列を共有しない）
          var gwkD = o.dstGw && !o.landOver;
          var exK = gwkD ? bcx + (o.landSlot || 0)
                         : bx + bw * (0.38 - 0.30 * (kN > 1 ? kIdx / (kN - 1) : 0.5));
          var tipK = bb - (o.dstGw ? Math.min(bh / 2, Math.abs(exK - bcx) * (bh / bw)) : 0);
          var krx = Math.max(10, Math.min(30, Math.abs(exK - xd) * 0.25));
          var dK = "M" + ax + "," + acy +
            " C" + (ax - 14) + "," + acy + " " + xd + "," + (acy + 16) + " " + xd + "," + (ab + 6) +
            " L" + xd + "," + (rBotS + 4) +
            " C" + xd + "," + (rBotS + 14) + " " + gxK + "," + (rBotS + 14) + " " + gxK + "," + (rBotS + 24) +
            " L" + gxK + "," + (kY + 10) +
            " C" + gxK + "," + kY + " " + (exK - krx) + "," + kY + " " + exK + "," + kY +
            " L" + exK + "," + (tipK + 5) + " L" + exK + "," + tipK;
          return { d: dK, tan: -90, face: "up", keepX: true, end: true,
            rowGap: (kY - rBotT) + 26, lx: gxK - 8, ly: kY - 9 };
        }
      } else if (o.laneUsed && !o.dstGw && sideRightMax !== null) {
        // sideRightMax が null の窄幅状態（サイド列が中段下に積まれる）では、
        // 外側の縦通路そのものが無いので通常経路に落とす（実測 360px で
        // clamp 折返し 704px の縦線が積みカードを全貫通した）
        var fN = Math.max(1, o.laneCountFwd || 1);
        var fIdx = o.chanFwd || 0;
        var exF = o.dstGw ? bcx + 30 + fIdx * Math.min(24, (bw / 2 - 46) / Math.max(1, fN - 1))
          : bx + bw * (0.60 + 0.32 * (fN > 1 ? fIdx / (fN - 1) : 0.5));
        // 段ピッチは通路ピッチ (12) より広めに開ける。16 だと隣レーンの旋回
        // 曲線が 2px 格子で共有セルを持つ（実測 big s108/s112 の着地曲線 px12）
        var yyF = rBotT + 14 + (fN - 1 - fIdx) * 20;
        // サイド列があるとき gxW を clampW で頭打ちすると、列の右端より内側
        // に戻されて縦線がカードの縁を刺す（実測 1054 で 94px 貫通）。列の
        // 外側 +14 はレーン min-width が保証するので clamp しない。列が無い
        // ときだけ clamp 内側に寄せる
        var gxW = sideRightOver === null
          ? Math.max(spanR + base, Math.min(clampW - 14, clampW - 14 + fIdx * 12))
          : Math.max(spanR + base, sideRightOver + 14 + fIdx * 12);
        // ひし形の出所は顔スロット登記の下辺刻み。角丸カードは下辺を扇で刻む
        var gsO = o.srcGw ? (o.gslot || 0) : 0;
        var sxO = acx + gsO;
        var sdy = ab - (o.srcGw ? Math.min(ah / 2, Math.abs(gsO) * (ah / aw)) : 0);
        if (o.srcGw && o.exitOver) {
          // 顔の収容を超えた出口は右頂点の脇から出す。展開中の回り込みは右列を
          // 共有するので、左頂点だとカードの右辺に沿って縦に下りることになる。
          // 始点はひし形の輪郭の上。y を刻んだら x も斜辺に沿って内側へ寄るので、
          // 輪郭から浮かず、降り出しの同じ x 同士の並走も起きない
          var dyW = ((o.eoIdx || 0) - ((o.eoN || 1) - 1) / 2) *
            Math.min(12, (ah - 16) / Math.max(1, o.eoN));
          sdy = acy + dyW;
          sxO = acx + (aw / 2) * (1 - Math.min(1, Math.abs(dyW) / (ah / 2)));
        }
        var ocF = o.outCount || 0;
        // 出口扇はサイド列の有無に限らず、同じ出所に複数出口があるなら刻む。
        // 360px 実測: サイド列のない行の回り込みが扇なしで中央 x に出たため、
        // −11 にずれた隣接ドロップ縁の曲線（中央へ戻ってくる）と同じ列に
        // 重なり、降り始め 10px が並走した
        if (ocF > 1 && !o.srcGw && o.sideCards.length) sxO += ((o.outI || 0) - (ocF - 1) / 2) * Math.max(14, Math.min(22, (aw - 16) / (ocF - 1)));
        var krf = Math.max(10, Math.min(34, Math.abs(gxW - exF) * 0.3));
        // 旋回の峰（yyF − krf）が宛先行のサイド列の下端より上だと、曲がりの
        // 右上が列の下端際を斜めに刺す（実測 pierce 72）。峰を列下端+4 より
        // 下へ下げ、そこから立ち上げる（krf を縮める）
        var colB = -1e9;
        for (var ci = 0; ci < o.sideCards.length; ci++) {
          var cd = o.sideCards[ci];
          if (cd.x1 <= exF + 8 || cd.y0 >= yyF + 6 || cd.y1 <= yyF - 64) continue;
          colB = Math.max(colB, cd.y1);
        }
        if (colB > -1e8) krf = Math.min(krf, Math.max(6, yyF - colB - 4));
        // ひし形の右下辺に乗るため、終端は辺の実 y（行下帯から上へ戻して辺に立てる）
        var yF = o.dstGw ? bcy + (bx + bw - exF) * bh / bw : bb;
        // 旋回の横走りは自行直下を抜けるが、自行のサイド列は行下へ約 12px
        // はみ出し、次行の列は行上へ約 12px 食い込む（maxHeight 中段+24 の
        // 上下中央寄せ）。窓を実測し、狭ければ自行の行下余白（srcGap）を広げて
        // 次の再測定で抜ける（+14 固定は自行列に当たり、+22 固定は次行列に
        // 刺さった実測あり）
        // 旋回の水平走 y と、自行行下余白の要求を決める。障害カードを
        // 「自行のカード（行下余白を広げても動かない）」と「他行のカード
        // （余白だけ広げると下へ逃げる）」に分けて数えるのが要点。
        // ・自行の列カードは中段より高いと行下へはみ出す（実測 rBotS+54 まで、
        //   flow order-events 刺し 16px）。水平走は必ずその下に置く。
        // ・他行のカード（段カード込み）が窓の上限。窄幅では列と中段が縞に
        //   なるので列だけで探すと中段のうえで水平走した（実測 360px で
        //   retry-gate 刺し 100px）。
        // ・降り列（出所と同じ x）を通る他行の段カードは水平走をその上に
        //   置かないと降り線が刺す（実測 360px で charge 刺し 112px）。
        // 窓が 16px 足りないぶんは行下余白の「増加量」として要求する。
        // 次行列は広げたぶんだけ下へ逃げるので絶対値だと cur < req が偽に
        // なって窓が凍った（実測 2.4px のまま刺さり続けた）
        var yLow = rBotS + 6;
        var winLo = 1e9;
        var allC = o.others ? o.sideCards.concat(o.others) : o.sideCards;
        for (var wi = 0; wi < allC.length; wi++) {
          var wd2 = allC[wi];
          if (wd2.y1 <= rBotS + 2) continue;
          var inSweep = wd2.x1 > Math.min(sxO, gxW) + 2 && wd2.x0 < Math.max(sxO, gxW) - 2;
          var inDesc = wd2.x0 < sxO - 2 && wd2.x1 > sxO + 2 && wd2.y0 > ab + 4;
          if (!inSweep && !inDesc) continue;
          var isOwn = !!(o.srcRow && wd2.el && wd2.el.closest && wd2.el.closest(".fc-row") === o.srcRow);
          if (isOwn) {
            if (inSweep && wd2.y1 > yLow && wd2.y0 < rBotS + 60) yLow = wd2.y1 + 6;
          } else {
            var yl3 = wd2.y0 <= rBotS + 2 ? wd2.y1 : wd2.y0;
            if (inSweep && yl3 < winLo) winLo = yl3;
            if (inDesc && wd2.y0 - 6 < winLo) winLo = wd2.y0 - 6;
          }
        }
        var srcGapReq = winLo - yLow < 16 && winLo < 1e8 ? yLow + 16 - winLo : 0;
        var yS = winLo - yLow >= 16 ? (yLow + winLo) / 2 : yLow + 8;
        if (yS > yyF - 14) yS = Math.max(yLow + 8, yyF - 14);
        // 降り口と水平走の角は 2 次ベジェの四角。制御点を yS−8 に置く 3 次
        // ベジェは水平走の直前で 6px ほど上へ膨らみ、上の窓で置いた yS が
        // 数 px で埋もれて上のカードを刺した（実測 len 16）。四角なら yS を
        // 越えない。幅が足りないときは角半径を縮める
        var rrS = Math.max(0, Math.min(6, Math.abs(gxW - sxO) / 2, Math.abs(yyF - krf - yS) / 2));
        var sgnS = gxW >= sxO ? 1 : -1;
        var sgnK = yyF - krf >= yS ? 1 : -1;
        var dF = "M" + sxO + "," + sdy +
          " L" + sxO + "," + (yS - rrS * sgnK) +
          (rrS > 0 ? " Q" + sxO + "," + yS + " " + (sxO + rrS * sgnS) + "," + yS : "") +
          " L" + (gxW - rrS * sgnS) + "," + yS +
          (rrS > 0 ? " Q" + gxW + "," + yS + " " + gxW + "," + (yS + rrS * sgnK) : "") +
          " L" + gxW + "," + (yyF - krf) +
          " C" + gxW + "," + yyF + " " + (exF + krf) + "," + yyF + " " + exF + "," + yyF +
          " L" + exF + "," + (yF + 5) + " L" + exF + "," + yF;
        return { d: dF, tan: yyF > yF ? -90 : 90, face: yyF > yF ? "up" : "down", keepX: true, end: true,
          rowGap: (yyF - rBotT) + 26, srcGap: srcGapReq, lx: Math.min(gxW, exF) - 8, ly: yyF - 9 };
      }
    }

    // 自分自身に戻る縁: 左頂点から出て左側で半周し、左辺（上寄り）へ水平に戻る
    if (o.self) {
      if (o.dstGw && open && o.sideCards && o.sideCards.length) {
        // 展開したゲートウェイの自分ループ: 左右の頂点付近は IO 矢印の着地点で、
        // 横の回り込みは必ず交差する（実測で矢印が読み取り線に刺さった）。
        // ひし形のうえ辺をまたぐ/arch に回し、IO の届かない上から出す。
        var p1x = bx + (acx - bx) * 0.70, p1y = acy + (bt - acy) * 0.70;
        var p2x = (bx + bw) - ((bx + bw) - acx) * 0.70, p2y = p1y;
        var yA = Math.max(14, bt - 18);
        var dA = "M" + p1x + "," + p1y +
          " C" + (p1x - 6) + "," + (p1y - 30) + " " + (acx - 60) + "," + yA + " " + acx + "," + yA +
          " C" + (acx + 60) + "," + yA + " " + (p2x + 2) + "," + (p2y - 34) + " " + p2x + "," + p2y;
        return { d: dA, tan: 90, face: "down", keepX: false, end: true, lx: acx - 26, ly: yA - 20 };
      }
      // 自分ループの縦線もカード外側・展開時はサイドカード内側の通路に収める
      var gxS = Math.max(outerL, Math.min(ax - base, ax - depth));
      // 自分ループの進入高さは「そのカードへ着く順番」で刻む。出所 fan 基準だと他の
      // 戻る縁と左辺の同じ高さに集まって重なる。上下の辺には触れない範囲に収める。
      var sSelf = arrC > 1 ? Math.max(2, Math.min(9, (bh - 12) / (arrC - 1))) : 0;
      var eyS = Math.max(bt + 8, Math.min(bb - 8, acy - 12 - f * 8 + (arrC > 1 ? (arrI - (arrC - 1) / 2) * sSelf : 0)));
      if (o.dstGw) eyS = Math.min(eyS, bt + 6);   // ひし形の左頂点付近は IO 矢印の着地点と
                                                  // 重なるため、左上辺のうえ寄りに寄せる
      var stubS = Math.max(12, Math.min(22, (ax - gxS) * 0.35));
      var exS = bx;
      if (o.dstGw) {   // ひし形の輪郭に戻るよう、入る高さで x を寄せる
        exS = bx + Math.min(bw / 2 - 6, (acy - eyS) * (bw / 2) / Math.max(1, bh / 2));
      }
      var gyS = Math.min(acy - 20, eyS - 10);
      // 縁の左（ガター側）から水平に右へ入る。内側から外へ向かう引き方だと
      // orient=auto の矢じりがカードの外を向き、ひし形では輪郭に埋もれて見えない
      var entryX = exS - stubS;
      var dS = "M" + ax + "," + acy +
        " C" + (ax - 16) + "," + (acy - 2) + " " + (gxS + 4) + "," + (acy - 12) + " " + gxS + "," + gyS +
        " C" + gxS + "," + (gyS - 12) + " " + (entryX - 8) + "," + (eyS - 8) + " " + entryX + "," + eyS +
        " L" + exS + "," + eyS;
      return { d: dS, tan: 0, face: "right", keepX: true, end: true, lx: gxS - 8, ly: gyS - 8 };
    }

    // ガター縦線の x: またぐカードの外側へ出し、使える通路（outerL/outerR）から出さない。
    // 出所・行き先だけ基準だと途中の広いカードを貫き、通路から出るとサイドカードを貫く。
    var clampL = function (x) { return Math.max(outerL, Math.min(spanL - base, x)); };
    var clampR = function (x) { return Math.max(spanR + base, Math.min(outerR, x)); };
    if (o.self) depth = Math.max(4, depth - 8);   // 自分ループは後方通路より外側を回る
    var gx = left ? clampL(spanL - depth) : clampR(spanR + depth);
    if (open && !up && ch === 0 && left && !o.self && !o.vert && !o.near) {
      // 通路を持たない回り込みでも展開中はサイド列の外側へ回す。内側ガター
      // （列の 3px 左）は読み取り矢印の着地面（カード縁から矢じりが左に 11px）を
      // 縦に貫く（実測: 支払い読み取りの矢じりと通知縁が重畳）
      gx = Math.max(10, Math.min(spanL - base,
        (sideLeftMin === null ? 10 : sideLeftMin - 14) - (o.laneCountFwd || 1) * 12));
    }
    if (open && !up && !o.self && !o.vert && ch > 0) {
      // 行き縁の回り込み: サイドカード帯の内側を通ると帯を貫くので、列の外縁の
      // 外（離間 14px）を深度ぶん 12px で刻む。
      var fwdEdge = left
        ? (sideLeftMin === null ? 10 : sideLeftMin - 14)
        : (sideRightMax === null ? clampW - 14 : sideRightMax + 14);
      // clampL/clampR は内側ガター用の上下限（上限がサイドカードの手前）なので
      // 余白を走るこの縁には使えない。余白の縁はレーンの端まで許す。
      var fwdN = Math.max(1, o.laneCountFwd || 1);
      var fwdPitch = fwdN > 1
        ? Math.max(4, Math.min(12, (left ? fwdEdge - 10 : clampW - 10 - fwdEdge) / (fwdN - 1)))
        : 12;
      gx = left
        ? Math.max(10, Math.min(spanL - base, fwdEdge - (ch - 1) * fwdPitch))
        : Math.max(spanR + base, Math.min(clampW - 10, fwdEdge + (ch - 1) * fwdPitch));
    }
    var d, yRun;
    if (up) {
      // 戻る縁は左頂点から出て、ガターとの角を丸めて上へ走る
      var fyU = acy - 10 - f * 8;
      var dcU = Math.max(12, Math.min(30, Math.abs(ax - gx) * 0.4));
      d = "M" + ax + "," + acy +
          " C" + (gx < ax ? ax - dcU : ax + dcU) + "," + acy + " " + gx + "," + (fyU + dcU) + " " + gx + "," + fyU;
      yRun = fyU;
    } else {
      // 下流の縁は下頂点から扇を出してガターへ。同じ出所は縦に刻む。
      // 同じカードから複数出すなら出る x も左右に刻む（同じ点だと分岐直前まで重なる）。
      var oc = o.outCount || 0;
      var sxStart = acx;
      var startY = -1;
      if (o.srcGw && o.exitOver) {
        // 顔に載らない出口は側面の頂点の脇から掃き出す。頂点を上下に刻み、
        // x は輪郭の傾きに沿わせる。y だけ刻むと始点が輪郭から浮く（静的検査 P2）
        var stgO = Math.min(12, (ah - 16) / Math.max(1, o.eoN));
        var dyG = ((o.eoIdx || 0) - ((o.eoN || 1) - 1) / 2) * stgO;
        startY = acy + dyG;
        sxStart = acx + (left ? -1 : 1) * (aw / 2) *
          (1 - Math.min(1, Math.abs(dyG) / (ah / 2)));
      } else if (o.srcGw) {
        // ひし形の始点は本数にかかわらず顔スロット登記の目盛から。出口が 1 本でも
        // y だけ目盛の高さへ上がると始点が輪郭から浮く（静的検査 P2）
        sxStart = acx + (o.gslot || 0);
      } else if (oc > 1) {
        // 普通カードは下辺の幅ぶん左右に刻む。
        var outStride = Math.max(6, Math.min(22, (aw - 16) / (oc - 1)));
        // 刻み幅の分母(outCount)と連番は同じ数え方で揃える。fan は戻る縁も
        // 通し番号なので、それを含む数え方の outCount と組み合わせると中央寄せが
        // 崩れて全編が右へ寄る（outI は outCount と同じ集合の連番）
        sxStart = acx + ((o.outI || 0) - (oc - 1) / 2) * outStride;
      }
      var ab0 = startY >= 0 ? startY : ab - (o.srcGw ? Math.min(ah / 2, Math.abs(o.gslot || 0) * (ah / aw)) : 0);
      var fyD = ab + 14 + f * 8;
      var d1D = Math.max(9, Math.min(20, (fyD - ab) * 0.6));
      d = "M" + sxStart + "," + ab0 +
          " C" + sxStart + "," + (ab0 + d1D) + " " + gx + "," + (fyD - d1D) + " " + gx + "," + fyD;
      yRun = fyD;
    }

    // 進入面を決める。まずは進行方向の正面（下流は上辺、上流は下辺）から。
    var sg = up ? -1 : 1;                          // ガターを走る向き
    var faceY = up ? bb : bt;
    // 同じ宛先へ集まる縁は、進入 x を連番ぶん刻む。出所 fan だけでは別々の出所が同じ点に
    // 収束して縦線が潰れる（実測 s119 頂点 22 セル）。ひし形は頂点のまわりで刻む。
    var arrOff = o.arrOff || 0;
    // ひし形への正面進入も辺に沿って刻む（前面は上辺、退回縁は下辺）。下辺の
    // 退回着地は顔スロット登記の外側目盛を使い、前面の複数本は矢じり幅より
    // 広く刻む。着地の y は傾いた辺の実測高さに立ち、矢じりを辺から浮かせない
    // 顔の収容数を超えた戻る縁は通常カード扱い（菱形の目盛を使わない）
    var gwLand = o.dstGw && !o.landOver && !o.topOver;
    var gwIn = gwLand ? (up ? (o.landSlot || 0) : (o.tslot || 0)) : 0;
    var ex = gwLand ? bcx + gwIn : bx + bw * (left || up ? 0.26 : 0.74) + (left ? -f * 14 : f * 14);
    ex = Math.max(bx + 6, Math.min(bx + bw - 6, ex + (gwLand ? 0 : arrOff)));
    // 宛先がひし形のとき、着地の y は常に輪郭上へ。矩形下端に置くと退避縁
    // （landOver/topOver）の矢じりが輪郭との隙間に浮く（静的検査 P2-1）
    var tipY = faceY;
    if (o.dstGw) {
      var eDrop = Math.min(bh / 2, Math.abs(ex - bcx) * (bh / bw));
      tipY = up ? bb - eDrop : bt + eDrop;
    }
    // 側通路の縁が下面へ溢れるほど集まるとき、上面進入の順序を通路の入れ子と
    // 揃える（外側のレーン=区間の深い縁ほど、レーンの近い端から入る）。
    // 連番の通し刻みのままだと深い縁が反対側から入り、旋回が浅い縁の曲線と
    // 接線状に重なる（実測 s080→s119 と s084→s119 が 10px 並走）
    if (!o.dstGw && !up && !left && !open && arrC > 1) {
      var capT = Math.max(1, Math.floor(((bb - 8) - (bt + 8)) / 12));
      if (arrC > capT && arrI < capT) {
        ex = Math.max(bx + 6, Math.min(bx + bw - 6,
          bx + bw * 0.74 + f * 14 + ((capT - 1 - arrI) - (capT - 1) / 2) * 14));
      }
    }
    var stub = Math.max(10, Math.min(22, Math.abs(faceY - yRun) * (up ? 0.2 : 0.25)));
    var ym = up ? tipY + stub : tipY - stub;   // 正面の外側、直進区間の端
    var dd = Math.max(12, Math.min(34, Math.abs(ym - yRun) * 0.45, Math.abs(ex - gx) * 0.7));
    var yt = up ? Math.min(yRun - 2, ym + dd) : Math.max(yRun + 2, ym - dd);
    var lblY = up ? yRun + 16 : yRun - 9;        // ラベルは扇（角）の出口の直後
    var front = {
      d: d + " L" + gx + "," + yt +
         " C" + gx + "," + (yt + sg * dd) + " " + ex + "," + (ym - sg * dd) + " " + ex + "," + ym +
         " L" + ex + "," + tipY,
      tan: up ? -90 : 90, face: up ? "up" : "down", keepX: true, end: true, lx: gx - 8, ly: lblY,
    };
    // たたみ時のゲートウェイ宛て戻る縁は、下辺の左半分へ横から入る。頂点近くへ
    // 縦に上がると、直前の水平走りが次の行のカード上端すぐ上を掃いて、その行へ
    // 上辺から入る分岐縁の矢じりに触れる（実測 s000→s001 双子の矢じり × s008 の
    // 戻る縁、s000 の直下に 16px の隙間しかない）。辺へ横に入れば次の行の帯に
    // 一切寄らない。区間の深い縁ほど辺の上に入り、横走りが内側の縦線と交わらない
    if (gwLand && up && !open && !o.vert) {
      var fN = Math.max(1, o.landN || 1);
      var fK = Math.max(0, Math.min(fN - 1, o.landIdx || 0));
      // 刻みは頂点から 0.78 以内（左頂点からは自分ループ ↺ が水平に出ていて、
      // その往路に矢じりが触れる。実測 s008 の矢じり × s000 の ↺）〜 0.31
      // （出口スロットの始点より 12px 以上左。出口は内側目盛なので 0.31 を切る
      // ことはない）。隣り合う着地の対角間隔が 12px を切るときは元の下面進入に
      // 戻る（辺が短くて矢じりを並べられない）
      var uIn = fN > 1 ? 0.78 - fK * (0.47 / (fN - 1)) : 0.55;
      var fromRight = gx > bcx;
      var xIn = fromRight ? bcx + (bw / 2) * uIn : bcx - (bw / 2) * uIn;
      var yIn = bb - (bh / 2) * uIn;
      var tipD = Math.hypot(bw / 2, bh / 2) * 0.47 / Math.max(1, fN - 1);
      if (tipD >= 12 && (fromRight ? gx - xIn : xIn - gx) >= 26) {
        var sgn = fromRight ? 1 : -1;
        front = {
          d: d + " L" + gx + "," + (yIn + 26) +
             " C" + gx + "," + (yIn + 8) + " " + (xIn + sgn * 24) + "," + yIn + " " + (xIn + sgn * 8) + "," + yIn +
             " L" + xIn + "," + yIn,
          tan: fromRight ? 180 : 0, face: fromRight ? "right" : "left",
          keepX: true, end: true, lx: gx - sgn * 8, ly: yIn - 8,
        };
      }
    }
    // 他のボックス（ひし形は輪郭）の中を横切るなら側面から入り直す
    if (!o.topOver && !pathHits(o.probe, front.d, o.others)) return front;

    // 正面へ回れないので側面から入る（他のボックスの背後に隠れないため）。
    // 同じ宛先へ n 本集まるとき、辺の実寸（側面は高さ bh）に等間隔で並べる。出所の扇 f は
    // ガター出口で既に横へ分かれているので、辺の上で足し込むと端のはみ出し分だけクランプで
    // 折り返され先端が同じ y に潰れる（s119 へ 11 本 → 4 本が 10605 に重畳）。
    var lo = bt + 8, hi = bb - 8;
    // 一辺に並べられる上限。間隔 12px 未満だと矢じり（≈11px）同士が重なる
    // （実測 s119 右辺 10 本 × 5px → arrowClash 18）。超えた分は下面から入れる。
    // 展開中はカードの側面がサイドカード列に囲まれるので、通路を持たない縁が
    // 通路（あき 20px 級）に滑り込めるのは 1 本まで。通路を持つ縁は下面へ回る。
    // 展開中の四角カードは左右辺がサブカードの着地面なので側面の刻みは 1。
    // ゲートウェイのひし形は辺が斜めで IO 矢印の着地面と違うため、展開中でも
    // 側面を縦に刻める（12 本収束が同じ点に重なった実測: s119）
    var faceCap = open ? (o.dstGw ? Math.max(1, Math.floor((hi - lo) / 14)) : 1)
      : Math.max(1, Math.floor((hi - lo) / 12));
    if (!up && arrC > faceCap && arrI >= faceCap) {
      var ovI = arrI - faceCap, ovN = arrC - faceCap;
      // 入れ子の階段: 通路の深い縁（ovI が大きい）ほど「カード間隔に近い段」と
      // 「右側の入口」にする。浅い縁の横走りは深い縁の縦進入より下を、深い縁の縦
      // 進入は浅い縁の横走りの右を終点にするので、どの組み合わせも交わらない
      // （段を逆にすると横走りが他縁の矢じりを刺す。実測 arrowOnLine 5）。
      // 入口 x は右半分（0.54〜0.94）。下面中央は次の縁の出口なので避ける。
      // 左右両側から 1 本ずつ退避すると、共通の目盛だと矢じりが同一点に潰れる
      // （静的検査 P1）。回る側で半分の幅を使い、段は ovI で揃える
      var ovFrac = ovN > 1 ? ovI / (ovN - 1) : 0.5;
      var exB = left ? bx + bw * (0.46 - 0.40 * ovFrac) : bx + bw * (0.54 + 0.4 * ovFrac);
      // 着地はこのカード下辺の出口列を避ける。出口の降り線の上に矢じりを
      // 乗せると出口をふさぐ（静的検査 P2）。退避を矢じり半分身幅ぶん押して、
      // カード幅に収める
      if (o.dstExit && o.dstExit.length) {
        for (var q2 = 0; q2 < 2; q2++) {
          for (var q = 0; q < o.dstExit.length; q++) {
            var colX = bcx + o.dstExit[q];
            if (Math.abs(exB - colX) < 12) exB += (exB < colX ? -1 : 1) * 12;
          }
        }
        exB = Math.max(bx + 6, Math.min(bx + bw - 6, exB));
      }
      // 段の間隔は曲線の立ち上がり幅（krB ≤ 34）より広くする。5px だと隣の段の
      // 床と、自縁のガターからの左旋回区間が同じ通路を通り、カーブ同士が
      // すり抜ける（実測 parallel 約100px/組 × 12 組）。
      var yyB = bb + 14 + (ovN - 1 - ovI) * 16;
      var krB = Math.max(10, Math.min(34, Math.abs(gx - exB) * 0.35));
      var tipB = bb - (o.dstGw ? Math.min(bh / 2, Math.abs(exB - bcx) * (bh / bw)) : 0);
      d += " L" + gx + "," + (yyB - krB) +
           " C" + gx + "," + yyB + " " + (exB + krB) + "," + yyB + " " + exB + "," + yyB +
           " L" + exB + "," + (tipB + 5) + " L" + exB + "," + tipB;
      return { d: d, tan: -90, face: "up", keepX: true, end: true,
        rowGap: (yyB - bb) + 26, lx: Math.min(gx, exB) - 8, ly: yyB - 9 };
    }
    var sideStride = arrC > 1 ? Math.max(12, Math.min(16, (hi - lo) / (Math.min(arrC, faceCap) - 1 || 1))) : 0;
    // 段の並び順は通路の入れ子と揃える。区間の深い縁ほど外側の通路を通るのだから、
    // 側面では一番下に進入する（左旋回が内側の縦線の下を素通りする）。上入れにすると
    // 外側の旋回が内側の縦線に接線状に寄る（実測 s080→s119 と s084→s119 が 10px 並走）
    var cap2 = Math.min(arrC, faceCap);
    var sideOff = arrC > 1 ? (cap2 - 1 - arrI - (cap2 - 1) / 2) * sideStride : f * 14;
    var sg2 = up ? -1 : 1;
    var xr = left ? bx : bx + bw;                    // 側面（左辺または右辺）の x
    // 展開中は上寄りの I/O コネクタと帯を分けるため側面進入を下寄りへ寄せる。
    // たたみ時はサイド列が無く中点で問題ないので従来どおり中点（下寄りにすると
    // s119 への 11 本の収束が下端に潰れて 28 セル重なった）。
    var yr = o.dstGw ? bcy + sideOff : bt + bh * (open ? 0.66 : 0.5) + sideOff;
    yr = Math.max(lo, Math.min(hi, yr));
    if (o.dstGw) {
      // ひし形は左（右）頂点だけが入り口だと先端が一点に潰れる。入る高さで輪郭上の x を
      // 求める（頂点から上下頂点へ行くほど中央寄りに戻る）。これで側面に沿って並く。
      var halfW = bw / 2, halfH = bh / 2;
      var edgeX = left
        ? bx + halfW - Math.abs(yr - bcy) * (halfW / halfH)
        : bx + halfW + Math.abs(yr - bcy) * (halfW / halfH);
      xr = left ? Math.min(bx + bw - 4, edgeX) : Math.max(bx + 4, edgeX);
    }
    var stub2 = Math.max(10, Math.min(20, Math.abs(gx - xr) * 0.35));
    var xe = left ? xr - stub2 : xr + stub2;          // 面の外側、直進区間の端
    var kR = Math.max(10, Math.min(34, Math.abs(gx - xe) * 0.45));
    var ya = up ? Math.min(yRun - 4, yr + kR) : Math.max(yRun + 4, yr - kR);
    var kR2 = Math.max(8, Math.min(kR, Math.abs(yr - ya) * 0.9));
    d += " L" + gx + "," + ya +
         " C" + gx + "," + (ya + sg2 * kR2) + " " + (xe + (left ? -kR2 : kR2)) + "," + yr +
         " " + xe + "," + yr + " L" + xr + "," + yr;
    return { d: d, tan: left ? 0 : 180, face: left ? "right" : "left", keepX: true, end: true,
      lx: gx - 8, ly: up ? yRun + 16 : yRun - 9 };
  }

  // 組んだ経路が他のボックスの中を横切るかを実測する（縁をボックスの背後に隠さないため）。
  // ひし形は矩形ではなく輪郭（内接判定）で見る。両端は自分のボックスに触れるので調べない。
  function pathHits(svg, d, others) {
    if (!svg || !others || !others.length) return false;
    var p = null;
    try {
      p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", d);
      p.setAttribute("style", "visibility:hidden");
      svg.appendChild(p);
      var len = p.getTotalLength();
      var n = Math.max(10, Math.floor(len / 4));
      for (var i = 1; i < n; i++) {
        var pt = p.getPointAtLength((len * i) / n);
        for (var j = 0; j < others.length; j++) {
          var b = others[j];
          if (b.gw) {
            if (Math.abs(pt.x - b.mx) / b.hw + Math.abs(pt.y - b.my) / b.hh <= 0.94) return true;
          } else if (pt.x > b.x0 + 1 && pt.x < b.x1 - 1 && pt.y > b.y0 + 1 && pt.y < b.y1 - 1) {
            return true;
          }
        }
      }
      return false;
    } catch (e) {
      return false;
    } finally {
      if (p && p.parentNode) p.parentNode.removeChild(p);
    }
  }

  // 2 つのカード間のベジェ。出る辺・入る辺を決め、制御点をその辺の外側法線上に張る。
  // そうすれば終端接線は必ず入る辺の法線（＝矢印の向き）と一致し、端だけ寝ることがない。
  // 制御点の間隔は gap に比例させ、曲線が巻き戻らない範囲に収める。
  function bezier(box, ra, rb, vertical, ioBox) {
    var ax = ra.left - box.left, ay = ra.top - box.top, aw = ra.width, ah = ra.height;
    var bx = rb.left - box.left, by = rb.top - box.top, bw = rb.width, bh = rb.height;
    var acx = ax + aw / 2, acy = ay + ah / 2, bcx = bx + bw / 2, bcy = by + bh / 2;
    // I/O の縁は水平接続のときだけボックス側の取り付け点を上寄りに寄せる。中点に付ける
    // と、同じ面へ戻る縁（next のループ）が通る通路と重なる（実測 6〜8 セル）。判断は
    // 必ず「元の中心」ですること。寄せた値で判定すると、ボックスとカードの縦差が横差を
    // 越えてしまい、水平に描くべき縁が縦接続に反転してサイド列を貫く（混雑検査で実測）。
    var boxTop = by + bh * 0.34, cardTop = ay + ah * 0.34;
    var x1, y1, x2, y2, nx, ny, face, gap;
    if (!vertical && Math.abs(bcx - acx) > 30 && Math.abs(bcx - acx) >= Math.abs(bcy - acy)) {
      var dir = bcx > acx ? 1 : -1;
      x1 = dir > 0 ? ax + aw : ax;
      x2 = dir > 0 ? bx : bx + bw;
      // 上端へ寄せるのはボックス側のみ。カード側は各カードの中心に保つ（積まれた複数
      // カードが同じ高さに潰れない）。上端に引きすぎると別カードを貫くので下限は面内。
      y1 = ioBox === "a" ? Math.max(ay + 4, Math.min(cardTop, bcy)) : acy;
      y2 = ioBox === "b" ? Math.max(by + 4, Math.min(boxTop, acy)) : bcy;
      nx = dir; ny = 0;
      face = dir > 0 ? "right" : "left";
      gap = Math.abs(x2 - x1);
    } else {
      var vdir = bcy > acy ? 1 : -1;
      y1 = vdir > 0 ? ay + ah : ay;
      y2 = vdir > 0 ? by : by + bh;
      x1 = ioBox === "a" ? acx : acx; x2 = bcx;
      nx = 0; ny = vdir;
      face = vdir > 0 ? "down" : "up";
      gap = Math.abs(y2 - y1);
    }
    // 終点は入る辺の法線上に短い直進区間（stub）を置いてから打つ。
    // これがないと終点の数 px 手前で線が寝たまま三角だけ真面を向くことになり、
    // 見た目と矢印の向きが食い違う（stub は必ず 7px 以上）。
    var stub = Math.max(8, Math.min(18, gap * 0.22));
    var d = Math.max(8, Math.min(40, (gap - stub) * 0.5));

    } catch (e) { /* matchMedia が無い環境は初期状態のまま */ }

    // --- ヘッダ / タブのイベント ---
    Object.keys(views).forEach(function (k) { views[k].ensure(); });
    Array.prototype.forEach.call(document.querySelectorAll(".tab-btn"), function (b) {
      b.addEventListener("click", function () { setView(b.dataset.view); });
    });
    $("#chip-unlinked").addEventListener("click", function () {
      state.filters.unlinked = !state.filters.unlinked;
      refresh();
    });
    $("#btn-reset-filter").addEventListener("click", function () {
      state.filters.kinds = new Set(KINDS);
      state.filters.provs = new Set(PROV_KINDS);
      state.filters.unlinked = false;
      refresh();
      toast("フィルタを解除しました");
    });
    $("#flow-select").addEventListener("change", function (ev) {
      state.flowId = ev.target.value;
      writeHash();
      refresh();
    });
    var si = $("#search-input");
    si.addEventListener("input", function () { runSearch(si.value); });
    si.addEventListener("focus", function () { if (si.value) runSearch(si.value); });
    si.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") {
        var first = document.querySelector("#search-results .sr-item");
        if (first) { selectNode(first.dataset.node); $("#search-results").classList.remove("open"); }
      } else if (ev.key === "Escape") {
        $("#search-results").classList.remove("open");
      }
    });
    document.addEventListener("click", function (ev) {
      if (!ev.target.closest || !ev.target.closest(".search-wrap")) $("#search-results").classList.remove("open");
    });
    $("#btn-export").addEventListener("click", exportAnn);
    $("#btn-clear-ann").addEventListener("click", clearAnn);
    $("#btn-share").addEventListener("click", function () {
      var url = shareUrl();
      this.setAttribute("data-url", url);
      copyText(url, "共有 URL をコピーしました");
    });
    window.addEventListener("hashchange", function () {
      if (suppressingHash) return;
      applyHash();
      applyTheme();   // hash の theme= でも切り替わる
      refresh();
      setView(state.view, true);
      renderDetail();
    });

    logs = logs || [];
    logs.forEach(function (l) { console.info("[注釈] " + l); });
    refresh();
    setView(state.view, true);
    writeHash();
    if (storage.available === false) toast("localStorage を使えないため、注釈はこのページ内に限り保持されます");
    if (logs.length) console.info("ローカル注釈を " + logs.length + " 件反映しました");
  }

  // テストと手動確認用の小さなフック（描画ロジックは DOM 経由で検証できる）
  window.__flowViewer = {
    state: state,
    views: views,
    graphView: graphView,
    flowView: flowView,
    visualEnds: visualEnds,
    setView: setView,
    selectNode: selectNode,
    shareUrl: shareUrl,
  };
  boot();
})();
</script>
</body>
</html>
