<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* ============================================================
   業務フロー データ I/O ビューア — ダークテーマ
   外部フォント・CDN なし。システムフォントのみ。
   ============================================================ */
:root {
  --bg: #0d1117;
  --bg2: #131a23;
  --bg3: #1a222d;
  --bg4: #222c39;
  --line: #26303f;
  --line-soft: #1e2732;
  --fg: #e6edf3;
  --muted: #8b98a9;
  --dim: #616e7f;
  --accent: #58a6ff;
  --warn: #d29922;
  --danger: #f85149;
  --ok: #3fb950;
  /* ノード種別 */
  --k-flow: #3fb950;
  --k-step: #58a6ff;
  --k-store: #f0883e;
  --k-boundary: #bc8cff;
  --k-code: #8b949e;
  /* 縁の種別 */
  --e-reads: #2dd4bf;
  --e-writes: #f0883e;
  --e-invokes: #bc8cff;
  --e-next: #3fb950;
  color-scheme: dark;
  --e-loop: #ff7b72;
  /* --- 面・UI 色（ライトテーマで差し替える） --- */
  --bg-panel: #0f151d; --bg-head: #101720; --bg-hover: #1c2734; --bg-sel: #17293f;
  --bg-sub: #141b23; --bg-dash: #191f27; --bg-open: #16202c; --bg-gw: #151d29; --bg-gw-open: #1a2534;
  --bg-row: #131a22; --bg-form: #121922; --bg-chip: #1b2431;
  --hdr-a: #161d26; --hdr-b: #10161e; --scroll-thumb: #2b3644; --halo: #0b1016;
  --shadow-pop: 0 12px 30px rgba(0, 0, 0, .55);
  --btn-pri-bg: #1f6feb; --btn-pri-hi: #388bfd; --btn-pri-fg: #ffffff;
  --accent-soft: rgba(88, 166, 255, .16); --accent-glow: rgba(88, 166, 255, .55);
  --fade-a: rgba(11, 16, 23, .86); --fade-b: rgba(11, 16, 23, 0);
  --canvas-a: #131c26; --canvas-b: #0b1017; --hud-bg: rgba(16, 24, 34, .8);
  --cv-label: #c7d2de; --cv-label-sel: #f0f6fc; --cv-ring: #f0f6fc; --cv-halo: rgba(8, 12, 18, .85);
  --e-impl: #6e7681; --e-touch: #4d5866; --e-cont: #39424e; --e-default: #4d5866;
  --warn-fg: #e8b34b; --warn-bd: #7a5c1a; --warn-bg: #2b2211;
  --danger-fg: #ff9a8c; --danger-bd: #7d3b34; --danger-bg: #2d1a17;
  --pv-def-fg: #7ee787; --pv-def-bd: #2ea04366; --pv-def-bg: #12261a;
  --pv-sta-fg: #9aa7b4; --pv-sta-bd: #4b5563aa; --pv-sta-bg: #1b2129;
  --pv-llm-fg: #d2a8ff; --pv-llm-bd: #8957e566; --pv-llm-bg: #241a33;
  --pv-hum-fg: #79c0ff; --pv-hum-bd: #1f6feb66; --pv-hum-bg: #12233c;
  --loop-fg: #ff8f85; --loop-bd: #7d3a35; --loop-bg: #3a1d1d;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
[data-kind="flow"] { --kc: var(--k-flow); }
[data-kind="step"] { --kc: var(--k-step); }
[data-kind="store"] { --kc: var(--k-store); }
[data-kind="boundary"] { --kc: var(--k-boundary); }
[data-kind="code"] { --kc: var(--k-code); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
    "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: 11.5px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- ヘッダ ---------- */
header.top {
  flex: 0 0 auto;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--hdr-a), var(--hdr-b));
  padding: 8px 14px 7px;
}
.top-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: 6px; }
.brand h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
.brand .sub { font-size: 11px; color: var(--dim); }
select, input[type="text"], input[type="number"] {
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 8px;
  outline: none;
}
select:focus, input:focus { border-color: var(--accent); }
.btn {
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 10px;
  color: var(--fg);
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--btn-pri-bg); border-color: var(--btn-pri-bg); color: var(--btn-pri-fg); }
.btn.primary:hover { background: var(--btn-pri-hi); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.btn.small { padding: 2px 7px; font-size: 11.5px; }

.search-wrap { position: relative; flex: 1 1 260px; max-width: 460px; min-width: 190px; }
#search-input { width: 100%; padding-left: 26px; }
.search-wrap::before {
  content: "🔍"; position: absolute; left: 7px; top: 50%; transform: translateY(-50%);
  font-size: 11px; opacity: .55; pointer-events: none;
}
#search-results {
  position: absolute; z-index: 60; top: calc(100% + 4px); left: 0; right: 0;
  max-height: 340px; overflow: auto;
  background: var(--bg2); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 12px 30px var(--shadow-pop);
  display: none;
}
#search-results.open { display: block; }
.sr-item { padding: 6px 9px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.sr-item:last-child { border-bottom: 0; }
.sr-item:hover, .sr-item.active { background: var(--bg-hover); }
.sr-name { display: flex; align-items: center; gap: 6px; }
.sr-id { color: var(--dim); font-family: var(--mono); font-size: 10.5px; word-break: break-all; }
.sr-note { color: var(--dim); font-size: 11px; }
.sr-head { padding: 5px 9px; color: var(--dim); font-size: 11px; background: var(--bg-head); }

/* ---------- フィルタ chips ---------- */
.filter-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 7px; }
.chip-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.chip-group > .gl { font-size: 11px; color: var(--dim); margin-right: 2px; }
.chip {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 11.5px;
  line-height: 1.7;
}
.chip.on {
  color: var(--fg);
  border-color: var(--kc, var(--accent));
  background: var(--accent-soft);
  background: color-mix(in srgb, var(--kc, var(--accent)) 24%, transparent);
}
.chip:hover { border-color: var(--kc, var(--accent)); }
.toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); }
.toggle.on { color: var(--warn); }

/* ---------- タブ ---------- */
nav.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--bg-panel); flex: 0 0 auto; }
.tab-btn {
  background: transparent; border: 0; border-bottom: 2px solid transparent;
  color: var(--muted); padding: 7px 12px 6px; font-size: 12.5px;
}
.tab-btn:hover { color: var(--fg); }
.tab-btn[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tab-btn .cnt { color: var(--dim); font-size: 11px; margin-left: 4px; }

/* ---------- 本体 ---------- */
main.body { flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
main.body > section.views { position: relative; min-width: 0; overflow: hidden; }
.view { position: absolute; inset: 0; overflow: auto; padding: 12px 14px 20px; display: none; }
.view.active { display: block; }
.view.no-pad { padding: 0; }
aside.detail {
  border-left: 1px solid var(--line);
  background: var(--bg2);
  overflow: auto;
  min-width: 0;
  padding: 12px 13px 24px;
}
@media (max-width: 1000px) {
  main.body { grid-template-columns: minmax(0, 1fr) 320px; }
}
@media (max-width: 760px) {
  /* 狭い画面では詳細パネルを下へ積む。横に 320px 確保すると本文が 40px に潰れるため */
  main.body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 3fr) minmax(0, 1fr); }
  aside.detail { border-left: 0; border-top: 1px solid var(--line); }
  /* フィルタチップが折り返すと本文が沈むので、狭い画面では 1 行を横スクロールさせる */
  .filter-row { flex-wrap: nowrap; overflow-x: auto; gap: 10px; padding-bottom: 2px; }
  .filter-row .chip-group, .filter-row .chip, .filter-row .btn { flex: 0 0 auto; flex-wrap: nowrap; }
}

/* ---------- ステータスバー ---------- */
footer.status {
  flex: 0 0 auto;
  border-top: 1px solid var(--line);
  background: var(--bg-panel);
  color: var(--muted);
  font-size: 11.5px;
  padding: 4px 14px;
  display: flex;
  gap: 14px;
  align-items: center;
  flex-wrap: wrap;
}
footer.status .dot { color: var(--dim); }

/* ---------- 共通の小さな部品 ---------- */
.badge {
  display: inline-block; border-radius: 4px; padding: 0 5px; font-size: 10.5px;
  line-height: 1.65; border: 1px solid var(--line); color: var(--muted); background: var(--bg-panel);
  white-space: nowrap;
}
.badge.cand { color: var(--warn); border-color: var(--warn-bd); background: var(--warn-bg); }
.badge.empty-io { color: var(--warn-fg); border-color: var(--warn-bd); background: var(--warn-bg); }
.badge.nullref { color: var(--danger-fg); border-color: var(--danger-bd); background: var(--danger-bg); }
.pv { display: inline-block; border-radius: 4px; padding: 0 5px; font-size: 10.5px; line-height: 1.65; border: 1px solid; }
.pv-definition { color: var(--pv-def-fg); border-color: var(--pv-def-bd); background: var(--pv-def-bg); }
.pv-static { color: var(--pv-sta-fg); border-color: var(--pv-sta-bd); background: var(--pv-sta-bg); }
.pv-llm { color: var(--pv-llm-fg); border-color: var(--pv-llm-bd); background: var(--pv-llm-bg); }
.pv-human { color: var(--pv-hum-fg); border-color: var(--pv-hum-bd); background: var(--pv-hum-bg); }
.kind-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--kc, var(--dim)); display: inline-block; flex: 0 0 auto; }
.kind-label { color: var(--kc, var(--muted)); font-size: 10.5px; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.hint { color: var(--dim); font-size: 11px; }
.sec-title { font-size: 11.5px; color: var(--dim); text-transform: none; letter-spacing: .04em; margin: 14px 0 5px; font-weight: 650; }
.card-panel { border: 1px solid var(--line); background: var(--bg2); border-radius: 8px; padding: 10px 11px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 10px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
.legend i.dash { border-top-style: dashed; }
.linkish { color: var(--accent); cursor: pointer; }
.linkish:hover { text-decoration: underline; }
.empty-note { color: var(--dim); padding: 18px 4px; }

table.grid { width: 100%; border-collapse: collapse; font-size: 12px; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line-soft); padding: 5px 7px; text-align: left; vertical-align: top; }
table.grid th { color: var(--dim); font-weight: 600; font-size: 11.5px; background: var(--bg-head); position: sticky; top: 0; z-index: 3; }
table.grid th.sortable { cursor: pointer; user-select: none; }
table.grid th.sortable:hover { color: var(--fg); }
table.grid th .arrow { color: var(--accent); }
table.grid tbody tr:hover { background: var(--bg-hover); }
table.grid tbody tr.sel { background: var(--bg-sel); }
/* td 自体を flex にすると table の列レイアウトが壊れるので、子は block で積む */
.cell-names .n { display: block; cursor: pointer; line-height: 1.6; }
.cell-names .n:hover { color: var(--accent); }
.io-tags { display: flex; gap: 4px; flex-wrap: wrap; }

/* ---------- フロー図（フローチャート） ---------- */
.flow-scroll { height: 100%; overflow: auto; }
.flow-bar {
  /* レーンより狭い画面では本体が横スクロールになるので、バーは上下左右に固定して常に見えるようにする */
  position: sticky; top: 0; left: 0; width: 100%; box-sizing: border-box;
  z-index: 4; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  font-size: 11px; color: var(--muted); padding: 7px 6px 9px;
  background: linear-gradient(180deg, var(--bg) 68%, var(--fade-a) 88%, var(--fade-b));
  border-bottom: 1px solid var(--line-soft);
}
.flow-bar .hintline { color: var(--dim); }
.flow-bar b { font-size: 12.5px; }
@media (max-width: 760px) {
  /* ツールバーは 260px 高に折り返して図を常時覆うので、狭い画面では 1 行に流して図の高さを返す */
  .flow-bar { position: relative; flex-wrap: nowrap; overflow-x: auto; padding: 5px 6px; gap: 8px; }
  .flow-bar > * { flex: 0 0 auto; }
  .flow-bar .hintline {
    color: var(--dim); flex: 1 1 140px; min-width: 80px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .flow-bar .legend { margin-bottom: 0; flex-wrap: nowrap; gap: 9px; }
}
.fc-lane { position: relative; display: flex; flex-direction: column; padding: 6px 8px 22px; }
#flow-edges { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: visible; }
#flow-edges path.edge { fill: none; stroke-width: 1.6; opacity: .8; }
#flow-edges path.edge.hl { opacity: 1; stroke-width: 2.6; }
#flow-edges path.edge.dimmed { opacity: .16; }
#flow-edges path.reads { stroke: var(--e-reads); }
#flow-edges path.writes { stroke: var(--e-writes); }
#flow-edges path.invokes { stroke: var(--e-invokes); }
#flow-edges path.dash { stroke-dasharray: 5 4; }
#flow-edges path.next { stroke: var(--e-next); }
#flow-edges path.loop { stroke: var(--e-loop); stroke-width: 2.4; opacity: .95; }
/* 分岐・ループのラベルはカードより上に出す（縁そのものはカードの裏を回る） */
#flow-edge-labels { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: visible; }
#flow-edge-labels text {
  font-size: 10.5px; font-weight: 650; dominant-baseline: middle;
  paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round;
}
#flow-edge-labels text.next { fill: var(--e-next); text-anchor: start; }
#flow-edge-labels text.loop { fill: var(--e-loop); text-anchor: end; }
#flow-edge-labels text.flip { text-anchor: end; }
/* ラベルの地色（カードやサイドカードに重なるので淡い土台を敷く） */
#flow-edge-labels rect.lbl-bg { fill: var(--bg2); stroke: var(--line); stroke-width: .6px; opacity: .93; }
#flow-edge-labels text.hl { font-size: 11.5px; }
#flow-edge-labels text.dimmed { opacity: .2; }
.fc-row { display: flex; align-items: flex-start; gap: 20px; position: relative; z-index: 1; }
.fc-mid { flex: 0 0 440px; min-width: 0; }
.fc-side-slot { flex: 1 1 0; min-width: 0; height: 0; position: relative; z-index: 2; align-self: center; }
/* サイド列は中央の行の垂直中央に置く。行数を増やさず、はみ出しは上下の 20px 通路へ
   等分に広がるので、次の行のカードを隠さない。高さは measureEdges で中央の行+len に抑える */
.fc-side {
  min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 0 2px;
  overflow-y: auto; background: var(--bg0); border-radius: 8px; transform: translateY(-50%);
}
/* サイドカードは 1 行に縮める（行の高さは中央のボックスだけで決める） */
.fc-side .fnode { padding: 3px 7px; display: flex; align-items: center; flex-wrap: nowrap; gap: 6px; }
.fc-side .fnode .id, .fc-side .fnode .meta { display: none; }
.fc-side .fnode > .t { flex: 1 1 auto; min-width: 0; gap: 5px; }
.fc-side .fnode > .pvs { flex: 0 1 auto; margin-top: 0; flex-wrap: nowrap; overflow: hidden; }
.fc-side .fnode > .pvs > * { flex: 0 0 auto; white-space: nowrap; }
/* 件数が多い列は 2 列に折り返して高さを抑える（measureEdges 前の確定判断） */
/* 件数の多い列は横方向に折り返す（縦フレックスのままだと列方向に折れてしまう） */
.fc-side.multi { flex-direction: row; flex-wrap: wrap; align-content: flex-start; }
.fc-side.multi > * { flex: 1 1 44%; min-width: 0 }
.fc-side.multi > .sub-wrap { margin-left: 0; flex: 1 1 100% }
.fc-side > .side-head, .fc-side > .hint, .fc-side > .gw-note { flex: 1 1 100% }
.io-mark {
  flex: 0 0 auto; font-size: 10px; font-weight: 700; line-height: 1.5;
  border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; color: var(--dim);
}
.io-mark[data-io="reads"] { color: var(--e-reads); border-color: var(--e-reads); }
.io-mark[data-io="writes"] { color: var(--e-writes); border-color: var(--e-writes); }
.io-mark[data-io="invokes"] { color: var(--e-invokes); border-color: var(--e-invokes); }
/* 分岐ノードの説明・ID はひし形の外（左列）に出す */
.gw-note {
  border: 1px dashed var(--line); background: var(--bg-sub); border-radius: 6px;
  padding: 5px 8px; font-size: 11px;
}
.gw-note .gn-id { font-family: var(--mono); font-size: 10px; color: var(--dim); word-break: break-all; }
.gw-note .gn-desc { color: var(--muted); margin-top: 3px; line-height: 1.5; }
.fc-arrow-row .fc-arrow { flex: 0 0 440px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--dim); font-size: 11px; padding: 4px 0; position: relative; z-index: 1; }
.fc-arrow-row .fc-side-slot { visibility: hidden; }
/* 開始・終了の目印（next 縁がない先頭・末尾だけに置く） */
.fc-term-row .fc-mid { text-align: center; }
.fc-term-row .term {
  display: inline-flex; align-items: center; height: 24px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--bg3);
  color: var(--muted); font-size: 11px; letter-spacing: .06em;
}
.fc-arrow .fc-arrow-svg { display: block; }
.fc-arrow-svg .stem { stroke: var(--accent); stroke-width: 1.7; fill: none; }
.fc-arrow-svg .head { fill: var(--accent); }
.fc-more { display: flex; justify-content: center; gap: 8px; align-items: center; margin-top: 10px; position: relative; z-index: 1; }
.side-head { font-size: 10.5px; color: var(--dim); letter-spacing: .04em; }
.fnode {
  position: relative; z-index: 1;
  border: 1px solid var(--line); border-left: 3px solid var(--kc, var(--line));
  background: var(--bg3); border-radius: 7px; padding: 7px 9px; cursor: pointer;
  transition: box-shadow .12s;
}
.fnode:hover { border-color: var(--accent); }
.fnode.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
.fnode.dashed { border-style: dashed; border-left-style: solid; background: var(--bg-dash); }
.fnode .t { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; min-width: 0; }
.fnode .t .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fnode .id { color: var(--dim); font-family: var(--mono); font-size: 10px; word-break: break-all; margin-top: 2px; }
.fnode .meta { color: var(--muted); font-size: 11px; margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; }
.fnode .pvs { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
/* ステップボックス（フローチャートのノード） */
.step-box { padding-right: 26px; }
.step-box .mk { color: var(--dim); font-size: 10px; width: 9px; flex: none; }
.step-box.expanded { border-color: var(--accent); background: var(--bg-open); }
.step-box.expanded .mk { color: var(--accent); }
.step-box .num { color: var(--dim); font-weight: 500; font-family: var(--mono); flex: none; }
.step-box .info {
  position: absolute; right: 5px; top: 5px; width: 18px; height: 18px; line-height: 16px; padding: 0;
  border: 1px solid var(--line); border-radius: 5px; background: var(--bg-panel); color: var(--muted);
  font-size: 11px; cursor: pointer;
}
.step-box .info:hover { color: var(--fg); border-color: var(--accent); }
.step-box.hl { outline: 2px solid var(--warn); outline-offset: 1px; }
/* 分岐ノード（gateway）はひし形。疑似要素を clip-path で切り、2px 差分を縁に見せる */
.step-box.gw {
  width: 78%; margin: 3px auto; padding: 15px 44px; text-align: center;
  background: transparent; border: none; border-radius: 0;
}
.step-box.gw::before, .step-box.gw::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
}
.step-box.gw::before { background: var(--k-boundary); }
.step-box.gw::after { inset: 2px; background: var(--bg-gw); }
.step-box.gw:hover::before, .step-box.gw.expanded::before { background: var(--accent); }
.step-box.gw.hl::before { background: var(--warn); }
.step-box.gw.expanded::after { background: var(--bg-gw-open); }
/* ラベルがサイドカードと空かない行だけ行間を広げる（drawEdges が測り直して付ける） */
.fc-row.lbl-gap { padding-bottom: 30px; }
/* ひし形に四角い outline は似合わないので、選択・強調は疑似要素側の色で出す */
.step-box.gw.selected, .step-box.gw.hl { outline: none; }
.step-box.gw.selected::before { background: var(--accent); filter: drop-shadow(0 0 5px var(--accent-glow)); }
/* 展開してもひし形の大きさは変えない（id と説明は左列のメモへ回すため、中身は名前と分岐数だけ） */
.step-box.gw .t, .step-box.gw .pvs { justify-content: center; }
.step-box.gw .id, .step-box.gw .meta { text-align: center; }
/* ⓘ は頂点上に置かない（頂点に刺さった縁と見分けがつかないため）。
   ボックス bbox 右上の余白＝ひし形の輪郭の外に出す。上辺の傾きは緩やかなので角は常に外側。 */
.step-box.gw .info { right: 6px; top: 6px; }
/* 下頂点からの扇・頂点直結の短い垂直通路のため、次の行との間に余裕を空ける */
.step-box.gw.fan-gap { margin-bottom: 26px; }
.gwmark { color: var(--k-boundary); flex: none; font-size: 11px; }
.b-io.g { color: var(--e-next); }
.badge.loop { background: var(--loop-bg); color: var(--loop-fg); border-color: var(--loop-bd); }
.sub-card.branch .bl { color: var(--e-next); font-weight: 650; }
.sub-card.branch.loop .bl { color: var(--e-loop); }
.b-io { background: var(--bg-chip); color: var(--muted); border: 1px solid var(--line); }
.b-io.r { color: var(--e-reads); } .b-io.w { color: var(--e-writes); } .b-io.i { color: var(--e-invokes); }
.xcount { display: none; }
.xcount.on { display: inline-flex; background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-bd); }
.sub-wrap { margin: 4px 0 0 14px; display: flex; flex-direction: column; gap: 5px; position: relative; z-index: 1; }
.sub-card {
  border: 1px dashed var(--line); background: var(--bg-sub); border-radius: 6px; padding: 4px 7px;
  font-size: 11.5px; cursor: pointer; display: flex; align-items: center; gap: 6px;
}
.sub-card:hover { border-color: var(--accent); }
.sub-card.selected { outline: 2px solid var(--accent); }
.sub-card .lbl { color: var(--dim); font-size: 10px; }
.cand-band { margin: 16px 6px 0; border-top: 1px dashed var(--line); padding-top: 12px; position: relative; z-index: 1; }
.cand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 6px; }
.col-head {
  height: 30px; display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line);
  margin-bottom: 2px; font-weight: 650;
}
.col-head .n { color: var(--dim); font-weight: 400; }

/* ---------- グラフ（canvas） ---------- */
.canvas-host { position: absolute; inset: 0; }
#graph-canvas { display: block; width: 100%; height: 100%; background: radial-gradient(1200px 700px at 45% 20%, var(--canvas-a), var(--canvas-b) 70%); cursor: grab; }
#graph-canvas.dragging { cursor: grabbing; }
.canvas-hud {
  position: absolute; left: 10px; top: 10px; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap;
  align-items: center; font-size: 11px; color: var(--muted);
}
.canvas-hud .box { background: var(--hud-bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; backdrop-filter: blur(3px); }
.canvas-hud .box.on { color: var(--warn); border-color: var(--warn-bd); }

/* ---------- コード一覧 ---------- */
.code-item { border: 1px solid var(--line); border-radius: 8px; background: var(--bg2); margin-bottom: 8px; overflow: hidden; }
.code-head { display: flex; align-items: center; gap: 9px; padding: 7px 10px; cursor: pointer; }
.code-head:hover { background: var(--bg-hover); }
.code-head .path { font-family: var(--mono); font-size: 12px; }
.code-body { border-top: 1px solid var(--line-soft); background: var(--bg-panel); }
table.signals { width: 100%; border-collapse: collapse; font-size: 11.5px; }
table.signals th, table.signals td { padding: 4px 8px; border-bottom: 1px solid var(--line-soft); text-align: left; }
table.signals th { color: var(--dim); font-weight: 600; background: var(--bg-head); }
table.signals td.line { color: var(--dim); font-family: var(--mono); width: 54px; }
table.signals td.sig { font-family: var(--mono); color: var(--muted); width: 110px; }
table.signals td.snip { font-family: var(--mono); white-space: pre-wrap; word-break: break-word; cursor: pointer; }
table.signals td.snip:hover { color: var(--accent); }
table.signals tr.hl td { background: var(--bg-sel); }

/* ---------- 詳細パネル ---------- */
#detail-panel .dt-head { display: flex; align-items: flex-start; gap: 8px; }
#detail-panel .dt-name { font-size: 15px; font-weight: 650; line-height: 1.35; }
#detail-panel .dt-id { font-family: var(--mono); font-size: 10.5px; color: var(--dim); word-break: break-all; margin-top: 2px; }
table.kv { width: 100%; border-collapse: collapse; font-size: 11.5px; }
table.kv td { border-bottom: 1px solid var(--line-soft); padding: 3px 6px; vertical-align: top; }
table.kv td.k { color: var(--dim); width: 34%; word-break: break-all; }
table.kv td.v { word-break: break-word; }
.edge-group { margin-bottom: 8px; }
.edge-group .eg-title { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.edge-row { border: 1px solid var(--line-soft); border-radius: 6px; padding: 4px 7px; margin-bottom: 4px; background: var(--bg-row); }
.edge-row .er-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.edge-row .er-note { color: var(--muted); font-size: 11px; margin-top: 2px; }
.edge-row .er-conf { color: var(--dim); font-size: 10.5px; font-family: var(--mono); }
.ev-row { font-size: 11px; padding: 3px 0; border-bottom: 1px solid var(--line-soft); }
.ev-row .loc { font-family: var(--mono); color: var(--accent); cursor: pointer; }
.ev-row .snip { font-family: var(--mono); color: var(--muted); white-space: pre-wrap; word-break: break-word; display: block; margin-top: 1px; }
form.ann { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-form); margin-bottom: 8px; }
form.ann label { font-size: 11px; color: var(--dim); display: block; margin-bottom: 2px; }
form.ann .row { display: flex; gap: 6px; flex-wrap: wrap; }
form.ann .row > * { flex: 1 1 auto; min-width: 0; }
form.ann summary { cursor: pointer; font-size: 12px; color: var(--fg); font-weight: 600; }
.warn-out { color: var(--warn); font-size: 11px; }
.ann-pick { max-height: 130px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; display: none; }
.ann-pick.open { display: block; }
.ann-pick div { padding: 4px 7px; cursor: pointer; font-size: 11.5px; border-bottom: 1px solid var(--line-soft); }
.ann-pick div:hover { background: var(--bg-hover); }

#toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
  background: var(--bg-hover); border: 1px solid var(--accent); color: var(--fg);
  padding: 7px 14px; border-radius: 8px; font-size: 12px; opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 200; max-width: 70vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#fatal { padding: 26px; color: var(--danger); }

/* ============================================================
   ライトテーマ。:root の変数を差し替えるだけ（値のハードコード禁止）。
   縁と種別の 9 色は白地で沈まないよう彩度・明度を落としめにしている。
   ============================================================ */
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f6f9; --bg2: #fbfcfe; --bg3: #eaeef4; --bg4: #dee5ee;
  --line: #ccd5e0; --line-soft: #e1e7ef;
  --fg: #17202c; --muted: #4a5665; --dim: #64707f;
  --accent: #0a5cc4; --ok: #13732f; --warn: #8a5d00; --danger: #b42318;
  --k-flow: #13732f; --k-step: #0a5cc4; --k-store: #9a5b00; --k-boundary: #6b3fd4; --k-code: #556070;
  --e-reads: #0b6e78; --e-writes: #a85200; --e-invokes: #7333c9; --e-next: #13732f; --e-loop: #cc2230;
  --e-impl: #79838f; --e-touch: #8b95a4; --e-cont: #a3b0c2; --e-default: #8b95a4;
  --bg-panel: #eaeef4; --bg-head: #eef2f7; --bg-hover: #e0e8f2; --bg-sel: #d3e6fb;
  --bg-sub: #ffffff; --bg-dash: #f2f5f9; --bg-open: #e8f1fd; --bg-gw: #ffffff; --bg-gw-open: #e8f1fd;
  --bg-row: #fbfcfe; --bg-form: #f7f9fc; --bg-chip: #e7ecf3;
  --hdr-a: #ffffff; --hdr-b: #eef1f6; --scroll-thumb: #bcc7d4; --halo: #ffffff;
  --shadow-pop: 0 10px 26px rgba(24, 38, 58, .16);
  --btn-pri-bg: #0a5cc4; --btn-pri-hi: #0a4fa8; --btn-pri-fg: #ffffff;
  --accent-soft: rgba(10, 92, 196, .13); --accent-glow: rgba(10, 92, 196, .4);
  --fade-a: rgba(244, 246, 249, .9); --fade-b: rgba(244, 246, 249, 0);
  --canvas-a: #ffffff; --canvas-b: #eaeff6; --hud-bg: rgba(255, 255, 255, .88);
  --cv-label: #3a4657; --cv-label-sel: #0f1b2b; --cv-ring: #0f1b2b; --cv-halo: rgba(255, 255, 255, .92);
  --warn-fg: #7a4f00; --warn-bd: #dcc793; --warn-bg: #fbf1dc;
  --danger-fg: #a02418; --danger-bd: #f0c3bd; --danger-bg: #fdefed;
  --pv-def-fg: #11642a; --pv-def-bd: #b9dfc2; --pv-def-bg: #e3f3e8;
  --pv-sta-fg: #4a5665; --pv-sta-bd: #ccd5e0; --pv-sta-bg: #eaf0f7;
  --pv-llm-fg: #6a2fbd; --pv-llm-bd: #ddcbf5; --pv-llm-bg: #efe3fb;
  --pv-hum-fg: #0a5cc4; --pv-hum-bd: #c6ddf7; --pv-hum-bg: #e2eefb;
  --loop-fg: #b4231f; --loop-bd: #f2c7c1; --loop-bg: #fdefed;
}
/* 縁の三角マーカーもテーマ変数で塗る（JS に色を持たせない） */
#flow-edges marker.mk-reads path { fill: var(--e-reads); }
#flow-edges marker.mk-writes path { fill: var(--e-writes); }
#flow-edges marker.mk-invokes path { fill: var(--e-invokes); }
#flow-edges marker.mk-next path { fill: var(--e-next); }
#flow-edges marker.mk-loop path { fill: var(--e-loop); }
</style>
<script>
  /* 描画開始前にテーマを決めておいて、ちらつきを防ぐ（本体スクリプトでも同じ値を再適用する）。
     hash の theme=（共有 URL）、保存キー flow-theme の順に優先。どちらも無ければ prefers-color-scheme。 */
  (function () {
    try {
      var de = document.documentElement, m = "system";
      var h = String(location.hash || "").match(/[#&]theme=(light|dark)(?=&|$)/);
      if (h) m = h[1];   // 共有 URL は保存値より優先（本体スクリプトと同じ）
      try {
        if (m === "system") {
          var v = window.localStorage.getItem("flow-theme");
          if (v === "light" || v === "dark" || v === "system") m = v;
        }
      } catch (e) { /* localStorage 不可でも続行 */ }
      var light = m === "light" ||
        (m === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
      de.setAttribute("data-theme", light ? "light" : "dark");
      de.setAttribute("data-theme-mode", m);
    } catch (e) { /* 何もできない場合はダークのまま */ }
  })();
</script>

<script id="graph-data" type="application/json">"__GRAPH_DATA__"</script>
<script>
/* ============================================================
   ビューア本体。単一ファイル・オフライン動作を最優先にするため
   外部依存ゼロの素の JS（クラシックスクリプト）で書く。
   file:// でも動くように localStorage は失敗時の保険付き。
   ============================================================ */
(function () {
  "use strict";

  // ---------- 定数（docs/schema.md とあわせる） ----------
  var KINDS = ["flow", "step", "store", "boundary", "code"];
  var KIND_LABEL = { flow: "フロー", step: "ステップ", store: "保存先", boundary: "境界", code: "コード" };
  var PROV_KINDS = ["definition", "static", "llm", "human"];
  var PROV_LABEL = { definition: "定義", static: "静的", llm: "LLM", human: "人間" };
  var PROV_RANK = { definition: 0, static: 1, llm: 2, human: 3 };
  var EDGE_KINDS = ["contains", "next", "reads", "writes", "invokes", "implemented-by", "touches"];
  var EDGE_LABEL = {
    contains: "含む", next: "次へ", reads: "読み取り", writes: "書き込み",
    invokes: "呼び出し", "implemented-by": "実装コード", touches: "コードからアクセス",
  };
  var STORE_KINDS = ["table", "file", "s3", "queue", "topic", "kv", "other"];
  var BOUNDARY_KINDS = ["http", "lambda", "sfn", "grpc", "cli", "other"];
  var ANN_KEY = "flow-annotations";
  // 大量データで初期表示が固まらないための打ち切り（超分は「さらに表示」で出す）
  var TABLE_CAP = 400;
  var FLOW_COL_CAP = 250;
  var EDGE_CULL_MIN = 400; // これを超える縁は画面外を描かない
  // ガター通路の間隔。通路（chan）と扇（fan）の刻みは互いに素になる組み合わせにする。
  // 倍数にすると ch1,f0 と ch0,f2 が同じ x に潰えて別の縁が見えなくなる。
  // 目盛りは通路 30 / 扇 9。通路は扇の幅（9×3=27）より広くして、通路1・扇0 が
  // 通路0・扇3 と同じ x に潰れないようにする。従来の 18/9 は通路1・扇0 と
  // 通路0・扇2 が同じ x になっていた。展開中の目盛りをたたんだときとちがう値に
  // すると、全展開のときだけ縁ラベルの土台がサイドカード列の上へ出る（合成検査の実測）たたんだときの基線はサイド列の分だけ外側、
  // 展開中は従来どおり 4 のぶんから出す
  var LANE_PITCH = 30, FAN_PITCH = 9;            // たたんだとき（サイド列が空で広い）
  var LANE_PITCH_OPEN = 30, FAN_PITCH_OPEN = 9;  // 展開中（サイドカードと中央のあいだ）
  var CAND_CAP = 200;
  var SEARCH_CAP = 50;

  // ---------- DOM ヘルパ ----------
  var SVG_NS = "http://www.w3.org/2000/svg";
  var SVG_TAGS = { svg: 1, g: 1, path: 1, defs: 1, marker: 1, circle: 1, line: 1, rect: 1, text: 1, tspan: 1, polyline: 1, polygon: 1 };
  function el(tag, attrs) {
    // SVG の要素は名前空間が違わないと描画されない（<svg> が HTML 扱いになると子も全部描けない）
    var isSvg = !!SVG_TAGS[tag];
    var node = isSvg ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") { if (isSvg) node.setAttribute("class", v); else node.className = v; }
        else if (k === "text") node.textContent = String(v);
        else if (k === "dataset") Object.keys(v).forEach(function (d) { node.dataset[d] = v[d]; });
        else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? "" : String(v));
      });
    }
    for (var i = 2; i < arguments.length; i++) {
      var kids = Array.isArray(arguments[i]) ? arguments[i] : [arguments[i]];
      kids.forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        node.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
      });
    }
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }
  function $(sel) { return document.querySelector(sel); }
  function esc(s) { return String(s); } // textContent 前提。HTML に埋め込まない

  // ---------- ローカル注釈（localStorage） ----------
  var storage = {
    available: true,
    get: function () {
      try { return window.localStorage.getItem(ANN_KEY); }
      catch (e) { storage.available = false; return null; }
    },
    set: function (s) {
      try { window.localStorage.setItem(ANN_KEY, s); return true; }
      catch (e) { storage.available = false; return false; }
    },
    remove: function () {
      try { window.localStorage.removeItem(ANN_KEY); return true; }
      catch (e) { storage.available = false; return false; }
    },
  };

  function emptyAnn() {
    return { schemaVersion: 1, producer: "human", nodes: [], edges: [], metadata: [] };
  }
  function loadAnn() {
    var raw = storage.get();
    if (!raw) return emptyAnn();
    var doc;
    try { doc = JSON.parse(raw); } catch (e) { return emptyAnn(); }
    if (!doc || typeof doc !== "object") return emptyAnn();
    var out = emptyAnn();
    if (Array.isArray(doc.nodes)) out.nodes = doc.nodes.filter(function (n) { return n && n.id; });
    if (Array.isArray(doc.edges)) out.edges = doc.edges.filter(function (e) { return e && e.source && e.target && e.kind; });
    if (Array.isArray(doc.metadata)) out.metadata = doc.metadata.filter(function (m) { return m && m.match && m.set; });
    return out;
  }
  function persistAnn() {
    if (!storage.set(JSON.stringify(state.ann, null, 2))) {
      toast("localStorage に保存できませんでした（ブラウザ設定で無効化されています）");
    }
  }

  // ---------- グラフ読み込み ----------
  // ---------- テーマ ----------
  // 保存キーは注釈（ANN_KEY）と分ける。注釈 JSON の書き出しには theme を混ぜない。
  var THEME_KEY = "flow-theme";
  var THEME_MODES = ["dark", "light", "system"];
  var themeMode = "system";   // "dark" | "light" | "system"
  var themeVars = Object.create(null);
  // canvas 描画の色は CSS 変数から読む（テーマ切替時に破棄して読み直す）
  function tv(name) {
    var v = themeVars[name];
    if (!v) {
      v = "";
      try { v = String(getComputedStyle(document.documentElement).getPropertyValue(name)).trim(); }
      catch (e) { /* file:// でも落ちない */ }
      v = v || "#8b949e";
      themeVars[name] = v;
    }
    return v;
  }
  function themeSystemIsLight() {
    try { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches); }
    catch (e) { return false; }
  }
  function themeResolved() {
    return themeMode === "system" ? (themeSystemIsLight() ? "light" : "dark") : themeMode;
  }
  function readThemeStore() {
    try {
      var v = window.localStorage.getItem(THEME_KEY);
      return THEME_MODES.indexOf(v) >= 0 ? v : "system";
    } catch (e) { return "system"; }
  }
  function applyTheme() {
    var r = themeResolved();
    var de = document.documentElement;
    de.setAttribute("data-theme", r);
    de.setAttribute("data-theme-mode", themeMode);
    themeVars = Object.create(null);
    var btn = document.getElementById("btn-theme");
    if (btn) {
      btn.textContent = themeMode === "light" ? "☀ ライト" : themeMode === "dark" ? "☾ ダーク" : "◐ システム";
      btn.dataset.mode = themeMode;
      btn.title = "テーマ: " + r + "（クリックで ダーク → ライト → システム）";
    }
    if (graphView && graphView.requestDraw) graphView.requestDraw();
    return r;
  }
  function cycleTheme() {
    themeMode = themeMode === "dark" ? "light" : themeMode === "light" ? "system" : "dark";
    try { window.localStorage.setItem(THEME_KEY, themeMode); } catch (e) { /* 保存できなくても表示は切り替わる */ }
    applyTheme();
    writeHash();
  }
  themeMode = readThemeStore();

  var state = {
    graph: { schemaVersion: 1, nodes: [], edges: [], warnings: [] },
    ann: emptyAnn(),
    byId: new Map(),
    out: new Map(),
    in: new Map(),
    degree: new Map(),
    view: "flow",
    flowId: null,
    selected: null,
    detailEdge: null,
    expanded: new Set(), // フロー図で展開中のステップ id（hash に載せる）
    focusId: null, // グラフタブの ⇧ フォーカス
    filters: { kinds: new Set(KINDS), provs: new Set(PROV_KINDS), unlinked: false },
    vis: { nodes: [], edges: [], nodeSet: new Set() },
    tableLimits: {},
  };

  function edgeKey(e) { return e.source + "\u0000" + e.kind + "\u0000" + e.target; }

  function kindOfId(id) {
    if (typeof id !== "string") return null;
    if (id.indexOf("flow:") === 0) return "flow";
    if (id.indexOf("step:") === 0) return "step";
    if (id.indexOf("store:") === 0) return "store";
    if (id.indexOf("boundary:") === 0) return "boundary";
    if (id.indexOf("code:") === 0) return "code";
    return null;
  }
  // lib/util.mjs の normalizeIdSegment とおなじ寄せ方（注釈で新規 ID を作るときに通す）
  function normSeg(s) {
    return String(s).trim().toLowerCase().replace(/[\s_]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
  }
  function nodeProvenance(n) { return (n.metadata && n.metadata.provenance) || "definition"; }
  function provLabel(p) { return PROV_LABEL[p] || p || "?"; }

  function reindex() {
    state.byId = new Map();
    state.out = new Map();
    state.in = new Map();
    state.degree = new Map();
    state.graph.nodes.forEach(function (n) {
      if (!n.id) return;
      if (!state.byId.has(n.id)) state.byId.set(n.id, n);
      state.out.set(n.id, []);
      state.in.set(n.id, []);
    });
    var kept = [];
    state.graph.edges.forEach(function (e) {
      if (!e || !state.byId.has(e.source) || !state.byId.has(e.target)) return;
      kept.push(e);
      state.out.get(e.source).push(e);
      var tin = state.in.get(e.target);
      if (tin) tin.push(e);
    });
    state.graph.edges = kept;
    state.byId.forEach(function (n, id) {
      var d = new Set();
      (state.out.get(id) || []).forEach(function (e) { d.add(e.target); });
      (state.in.get(id) || []).forEach(function (e) { d.add(e.source); });
      state.degree.set(id, d.size);
    });
    searchCache = null; // 注釈でノードが変わったので検索候補を作り直す
  }

  // 「未紐づけ」の定義: 候補フラグ、I/O が 1 つもないステップ、格納先へ届かない境界
  function isUnlinked(n) {
    if (n.metadata && n.metadata.candidate === true) return true;
    var outs = state.out.get(n.id) || [];
    if (n.kind === "step") {
      return !outs.some(function (e) { return e.kind === "reads" || e.kind === "writes" || e.kind === "invokes"; });
    }
    if (n.kind === "boundary") {
      return !outs.some(function (e) {
        return (e.kind === "reads" || e.kind === "writes") && (state.byId.get(e.target) || {}).kind === "store";
      });
    }
    return false;
  }

  function nodePasses(n) {
    if (!state.filters.kinds.has(n.kind)) return false;
    if (!state.filters.provs.has(nodeProvenance(n))) return false;
    if (state.filters.unlinked && !isUnlinked(n)) return false;
    return true;
  }
  function edgePasses(e) {
    if (!state.filters.provs.has(e.provenance)) return false;
    var s = state.byId.get(e.source), t = state.byId.get(e.target);
    return !!(s && t && nodePasses(s) && nodePasses(t));
  }
  function recomputeVisible() {
    var nodes = state.graph.nodes.filter(nodePasses);
    var set = new Set(nodes.map(function (n) { return n.id; }));
    var edges = state.graph.edges.filter(function (e) {
      return set.has(e.source) && set.has(e.target) && state.filters.provs.has(e.provenance);
    });
    state.vis = { nodes: nodes, edges: edges, nodeSet: set };
  }

  // ---------- ローカル注釈を graph に反映（既存優先で上書きしない） ----------
  var appliedEdgeKeys = new Set();
  function applyAnnDoc(doc) {
    var log = [];
    (doc.nodes || []).forEach(function (a) {
      var kind = kindOfId(a.id);
      if (!kind || (kind !== "store" && kind !== "boundary")) {
        log.push("注釈ノード " + a.id + " は store/boundary の規則外なのでスキップ");
        return;
      }
      var ex = state.byId.get(a.id);
      if (ex) { // 既存ノードには新規キーだけ足す（上書きしない）
        Object.keys(a.metadata || {}).forEach(function (k) {
          if (ex.metadata[k] === undefined) ex.metadata[k] = a.metadata[k];
        });
        if (a.metadata && a.metadata.candidate === false) delete ex.metadata.candidate;
        return;
      }
      var node = {
        id: a.id, kind: kind, name: a.name || a.id,
        metadata: Object.assign({}, a.metadata, { provenance: "human" }),
      };
      state.graph.nodes.push(node);
      log.push("注釈でノード追加: " + a.id);
    });
    if ((doc.nodes || []).length) reindex(); // 上のノード追加を縁のチェックから見えるようにする
    (doc.edges || []).forEach(function (a) {
      if (EDGE_KINDS.indexOf(a.kind) < 0) { log.push("未知の縁の種別 " + a.kind + " をスキップ"); return; }
      var s = state.byId.get(a.source), t = state.byId.get(a.target);
      if (!s || !t) { log.push("存在しないノードへの縁をスキップ: " + a.source + " -> " + a.target); return; }
      if (a.source === a.target) return;
      var key = edgeKey(a);
      if (appliedEdgeKeys.has(key)) return;
      var dup = state.graph.edges.some(function (e) { return edgeKey(e) === key; });
      if (dup) { appliedEdgeKeys.add(key); log.push("既存の縁と重複（既存優先）: " + a.source + " -" + a.kind + "-> " + a.target); return; }
      var conf = typeof a.confidence === "number" ? Math.min(1, Math.max(0, a.confidence)) : 0.7;
      var edge = { source: a.source, target: a.target, kind: a.kind, provenance: "human", confidence: conf };
      if (a.note) edge.note = a.note;
      state.graph.edges.push(edge);
      appliedEdgeKeys.add(key);
    });
    (doc.metadata || []).forEach(function (m) {
      var hits = state.graph.nodes.filter(function (n) { return matchNode(n, m.match); });
      if (hits.length !== 1) { log.push("metadata 注釈の match が " + hits.length + " 件: スキップ"); return; }
      var applied = false;
      Object.keys(m.set || {}).forEach(function (k) {
        if (hits[0].metadata === undefined) hits[0].metadata = {};
        if (hits[0].metadata[k] === undefined) { hits[0].metadata[k] = m.set[k]; applied = true; }
      });
      if (applied) appliedMetaKeys.add(JSON.stringify([m.match, m.set]));
    });
    return log;
  }
  var appliedMetaKeys = new Set();
  function matchNode(n, match) {
    if (!match) return false;
    var keys = Object.keys(match);
    if (keys.length === 0) return false;
    if (match.kind && n.kind !== match.kind) return false;
    if (match.id && n.id !== match.id) return false;
    if (match.path && n.id !== "code:" + match.path) return false;
    if (match.name && n.name !== match.name) return false;
    return true;
  }

  // ==========================================================
  //  共通 UI
  // ==========================================================
  var toastTimer = null;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }
  function copyText(text, okMsg) {
    function fallback() {
      try {
        var ta = el("textarea", { style: "position:fixed;top:-1000px;left:0", text: text });
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        toast(ok ? okMsg : "コピーできませんでした（URL は共有ボタンに保持）");
      } catch (e) {
        toast("コピーできませんでした");
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
    } else fallback();
  }

  function kindTag(n) {
    return el("span", { class: "kind-label", dataset: { kind: n.kind } },
      el("span", { class: "kind-dot" }), " ", KIND_LABEL[n.kind] || n.kind);
  }
  function provChip(p) {
    return el("span", { class: "pv pv-" + p, title: "出所: " + provLabel(p) }, provLabel(p));
  }
  function nodeLink(id, label) {
    var n = state.byId.get(id);
    return el("span", {
      class: "linkish", title: id,
      onclick: function (ev) { ev.stopPropagation(); selectNode(id); },
    }, label || (n ? n.name : id));
  }
  function confText(c) {
    if (typeof c !== "number" || isNaN(c)) return "";
    return "確度 " + (Math.round(c * 100) / 100);
  }
  function edgeProvenances(edges) {
    var seen = [];
    edges.forEach(function (e) { if (seen.indexOf(e.provenance) < 0) seen.push(e.provenance); });
    return seen;
  }
  function nodeProvenances(id) {
    var seen = [];
    var p = nodeProvenance(state.byId.get(id) || {});
    if (seen.indexOf(p) < 0) seen.push(p);
    (state.out.get(id) || []).forEach(function (e) { if (seen.indexOf(e.provenance) < 0) seen.push(e.provenance); });
    (state.in.get(id) || []).forEach(function (e) { if (seen.indexOf(e.provenance) < 0) seen.push(e.provenance); });
    return seen;
  }
  // ノードに紐づく evidence（node.metadata.evidence + 縁の metadata.evidence）を file:line で一意化
  function evidenceOf(n) {
    var out = [], seen = new Set();
    function push(ev) {
      if (!ev || !ev.path) return;
      var key = ev.path + ":" + ev.line + ":" + ev.signal;
      if (seen.has(key)) return;
      seen.add(key);
      out.push(ev);
    }
    ((n.metadata || {}).evidence || []).forEach(push);
    (state.in.get(n.id) || []).forEach(function (e) {
      if (e.kind !== "touches") return;
      (((e.metadata || {}).evidence) || []).forEach(push);
    });
    return out;
  }
  function codeSignals(n) { return ((n.metadata || {}).signals) || []; }

  // ==========================================================
  //  選択・タブ・URL hash
  // ==========================================================
  var suppressingHash = false;
  function shareUrl() {
    var base = location.href.split("#")[0];
    return base + "#" + hashQuery(true);
  }
  // theme は共有 URL にだけ載せる。生きている hash に書き写すと、その URL を再度開いた
  // ときに「共有元の選択」が後から変えた保存値より優先されてしまい、テーマが元に戻らない
  // （reload を繰り返す自動化スクリプトでは特に顕著）
  function hashQuery(withTheme) {
    var p = new URLSearchParams();
    p.set("view", state.view);
    if (state.flowId) p.set("flow", state.flowId);
    if (state.selected) p.set("select", state.selected);
    if (state.view === "flow" && state.expanded.size) p.set("expanded", Array.from(state.expanded).join(","));
    if (withTheme && themeMode !== "system") p.set("theme", themeMode);
    return p.toString();
  }
  function writeHash() {
    var q = hashQuery(false);
    suppressingHash = true;
    try { history.replaceState(null, "", "#" + q); }
    catch (e) { location.hash = q; }
    setTimeout(function () { suppressingHash = false; }, 0);
  }
  function applyHash() {
    var p = new URLSearchParams(location.hash.replace(/^#/, ""));
    var v = p.get("view");
    if (v && views[v]) state.view = v;
    var f = p.get("flow");
    if (f && state.byId.get(f) && state.byId.get(f).kind === "flow") state.flowId = f;
    var s = p.get("select"); // URLSearchParams が %3A を ":" に戻してくれる
    if (s && state.byId.has(s)) state.selected = s;
    else if (s) toast("hash の select=" + s + " はこのグラフに見つかりません");
    var th = p.get("theme");
    if (th === "light" || th === "dark") themeMode = th;   // 共有 URL は保存値より優先（この閲覧だけ優先）
    var ex = p.get("expanded"); // 展開状態も復元（%2C 区切りは URLSearchParams が "," に戻す）
    if (ex) ex.split(",").forEach(function (id) {
      if (!id) return;
      if (state.byId.has(id)) state.expanded.add(id);
      else toast("hash の expanded=" + id + " はこのグラフに見つかりません");
    });
  }

  function selectNode(id, opts) {
    opts = opts || {};
    var n = state.byId.get(id);
    if (!n) { toast("ノードが見つかりません: " + id); return; }
    state.selected = id;
    state.detailEdge = null;
    state.detailEvidence = null; // 前のノードのコード抜粋を残さない
    if (n.kind === "step" && n.parent && state.byId.get(n.parent)) state.flowId = n.parent;
    else if (n.kind === "flow") state.flowId = n.id;
    if (opts.view && views[opts.view]) {
      if (state.view !== opts.view) setView(opts.view, true);
    }
    writeHash();
    renderDetail();
    renderFlowSelect();
    markSelectedInViews();
    if (state.view === "graph") graphView.requestDraw();
    if (state.view === "flow") flowView.drawEdges();
  }
  function openEdge(edge, opts) {
    state.detailEdge = edge;
    state.selected = edge.source;
    writeHash();
    renderDetail();
    if (opts && opts.view && views[opts.view] && state.view !== opts.view) setView(opts.view, true);
    if (opts && opts.expandCode) codeView.expand("code:" + edge.source.replace(/^code:/, ""));
  }

  function setView(v, skipHash) {
    if (!views[v]) return;
    state.view = v;
    Array.prototype.forEach.call(document.querySelectorAll(".tab-btn"), function (b) {
      b.setAttribute("aria-selected", b.dataset.view === v ? "true" : "false");
    });
    Object.keys(views).forEach(function (k) {
      views[k].root.classList.toggle("active", k === v);
    });
    views[v].ensure();
    views[v].render();
    if (!skipHash) writeHash();
    if (v === "graph") graphView.requestDraw();
  }

  function markSelectedInViews() {
    document.querySelectorAll("[data-node]").forEach(function (node) {
      node.classList.toggle("sel", node.dataset.node === state.selected);
      if (node.classList.contains("fnode") || node.classList.contains("sub-card")) {
        node.classList.toggle("selected", node.dataset.node === state.selected);
      }
    });
    document.querySelectorAll("tr[data-node]").forEach(function (tr) {
      tr.classList.toggle("sel", tr.dataset.node === state.selected);
    });
    if (views.flow && views.flow.built && state.view === "flow") flowView.crossHighlight();
  }

  function refresh(opts) {
    recomputeVisible();
    renderStatus();
    renderChips();
    renderFlowSelect();
    views[state.view].ensure();
    views[state.view].render();
    renderDetail();
    if (state.view === "graph") graphView.syncFromFilter();
    if (opts && opts.keepSelection === false) { /* 将来用 */ }
  }

  // ==========================================================
  //  ヘッダ（chips / フロー選択 / 検索）とステータスバー
  // ==========================================================
  function renderChips() {
    var kinds = $("#kind-chips");
    var provs = $("#prov-chips");
    clear(kinds).appendChild(el("span", { class: "gl" }, "種別"));
    clear(provs).appendChild(el("span", { class: "gl" }, "出所"));
    KINDS.forEach(function (k) {
      var total = state.graph.nodes.filter(function (n) { return n.kind === k; }).length;
      kinds.appendChild(el("button", {
        class: "chip" + (state.filters.kinds.has(k) ? " on" : ""),
        dataset: { kind: k, chip: "kind-" + k }, "aria-pressed": state.filters.kinds.has(k) ? "true" : "false",
        onclick: function () { toggleSet(state.filters.kinds, k); refresh(); },
      }, KIND_LABEL[k] + " " + total));
    });
    PROV_KINDS.forEach(function (p) {
      var total = state.graph.nodes.filter(function (n) { return nodeProvenance(n) === p; }).length;
      provs.appendChild(el("button", {
        class: "chip" + (state.filters.provs.has(p) ? " on" : ""),
        dataset: { chip: "prov-" + p }, "aria-pressed": state.filters.provs.has(p) ? "true" : "false",
        onclick: function () { toggleSet(state.filters.provs, p); refresh(); },
      }, PROV_LABEL[p] + " " + total));
    });
    var un = $("#chip-unlinked");
    un.classList.toggle("on", state.filters.unlinked);
    un.setAttribute("aria-pressed", state.filters.unlinked ? "true" : "false");
  }
  function toggleSet(set, v) {
    if (set.has(v)) set.delete(v); else set.add(v);
  }

  function flows() {
    return state.graph.nodes.filter(function (n) { return n.kind === "flow"; })
      .sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
  }
  // 既定で開くフローは「手順が一番多いフロー」（主フロー）。名前順の先頭だけ見ると、
  // 1 ステップの別系統（日次レポートなど）が着地になって主フローが見えない
  function primaryFlow() {
    var best = null, bestN = -1;
    flows().forEach(function (f) {
      // 可視性で空振りすると主フローを選べないので、contains 縁の本数で数える
      var n = 0;
      state.graph.edges.forEach(function (e) { if (e.kind === "contains" && e.source === f.id) n++; });
      if (n > bestN || (n === bestN && (!best || f.id < best.id))) { best = f; bestN = n; }
    });
    return best ? best.id : null;
  }
  function renderFlowSelect() {
    var sel = $("#flow-select");
    var fs = flows();
    if (!fs.length) { sel.hidden = true; return; }
    sel.hidden = false;
    if (!state.flowId || !state.byId.has(state.flowId)) state.flowId = primaryFlow();
    var want = state.flowId;
    if (sel.options.length !== fs.length || sel.value !== want) {
      clear(sel);
      fs.forEach(function (f) { sel.appendChild(el("option", { value: f.id, text: f.name })); });
    }
    sel.value = want;
  }

  function renderStatus() {
    var bar = clear($("#status-bar"));
    bar.appendChild(el("span", { id: "status-counts" },
      "表示 " + state.vis.nodes.length + " / 全 " + state.graph.nodes.length + " ノード"));
    bar.appendChild(el("span", { class: "dot" }, "・"));
    bar.appendChild(el("span", { id: "status-edge-counts" },
      "表示 " + state.vis.edges.length + " / 全 " + state.graph.edges.length + " 縁"));
    bar.appendChild(el("span", { class: "dot" }, "・"));
    var annCount = state.ann.nodes.length + state.ann.edges.length + state.ann.metadata.length;
    bar.appendChild(el("span", {}, "ローカル注釈 " + annCount + " 件" + (storage.available ? "" : "（localStorage 不使用）")));
    if (state.flowId && state.byId.get(state.flowId)) {
      bar.appendChild(el("span", { class: "dot" }, "・"));
      bar.appendChild(el("span", {}, "フロー: " + state.byId.get(state.flowId).name));
    }
    var w = state.graph.warnings && state.graph.warnings.length;
    if (w) {
      bar.appendChild(el("span", { class: "dot" }, "・"));
      bar.appendChild(el("span", { class: "badge empty-io", title: state.graph.warnings.join("\n") }, "マージ警告 " + w + " 件"));
    }
  }

  // ---------- 検索 ----------
  var searchCache = null;
  function buildSearchCache() {
    searchCache = state.graph.nodes.map(function (n) {
      var snips = "";
      if (n.kind === "code") {
        snips = codeSignals(n).slice(0, 60).map(function (s) { return (s.snippet || "").slice(0, 200); }).join("\n");
      }
      return { id: n.id, hay: (n.name + "\n" + n.id + "\n" + snips).toLowerCase() };
    });
  }
  function runSearch(qRaw) {
    var q = qRaw.trim().toLowerCase();
    var box = $("#search-results");
    clear(box);
    if (q.length < 1) { box.classList.remove("open"); return; }
    if (!searchCache) buildSearchCache();
    var hits = [];

  // ==========================================================
  //  注釈の保存・書き出し・クリア

  function addAnnNode(node) {
    if (state.ann.nodes.some(function (n) { return n.id === node.id; })) return;
    state.ann.nodes.push(node);
  }
  function addAnnEdge(edge) {
    if (state.ann.edges.some(function (e) { return edgeKey(e) === edgeKey(edge); })) return;
    state.ann.edges.push(edge);
  }
  function addAnnMeta(match, set) {
    var key = JSON.stringify([match, set]);
    if (appliedMetaKeys.has(key)) return;
    appliedMetaKeys.add(key);
    state.ann.metadata.push({ match: match, set: set });
  }
  function saveAndApply(annDoc, msg) {
    var logs = applyAnnDoc(annDoc);
    persistAnn();
    reindex();
    refresh();
    if (state.view === "flow") flowView.drawEdges();
    if (logs && logs.length) logs.forEach(function (l) { console.info("[注釈] " + l); });
    toast(msg + (storage.available ? "" : "（ブラウザ保存に失敗: このセッション内のみ有効）"));
  }
  function exportAnn() {
    var doc = {
      schemaVersion: 1, producer: "human",
      nodes: state.ann.nodes, edges: state.ann.edges, metadata: state.ann.metadata,
    };
    var text = JSON.stringify(doc, null, 2) + "\n";
    var blob = new Blob([text], { type: "application/json" });
    var a = el("a", { href: URL.createObjectURL(blob), download: "human.json" });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(a.href);
      document.body.removeChild(a);
    }, 4000);
    var n = doc.nodes.length + doc.edges.length + doc.metadata.length;
    toast(n ? "human.json をダウンロードしました（注釈 " + n + " 件）" : "注釈はまだありません");

  function clearAnn() {
    if (!window.confirm("ブラウザ内の注釈をすべて消しますか？ リポジトリの annotations/human.json は消えません。")) return;

    appliedMetaKeys = new Set();

  // 埋め込みデータのみに戻して作り直す（注釈クリア用）

    if (!Array.isArray(state.graph.edges)) state.graph.edges = [];
    if (!Array.isArray(state.graph.warnings)) state.graph.warnings = [];
    reindex();
    state.flowId = primaryFlow();
    graphView.reset();

  }

      shown.forEach(function (st, i) {

    },
    // ステップ間の next 縁を側面ガターに描く。中央の ▼ に割り当てた 1 本以外は

    collectLinks: function (boxes) {

          var toEl = boxes.get(e.target);
          if (!toEl) return; // フィルタ外・「さらに表示」の先は描かない

          var srcGw = fromEl.classList.contains("gw");
          var dstGw = toEl.classList.contains("gw");

      // 下の行から出る縁を反対側へ回す。
      this.linkItems.forEach(function (it) {
        if (it.vert || it.side !== "right") return;
        var s0 = idx.get(it.edge.source) || 0, t0 = idx.get(it.edge.target) || 0;

        self.linkItems.forEach(function (it) { if (it.side === side) mine.push(it); });
        mine.sort(function (a, b) {
          var d = (idx.get(a.edge.source) || 0) - (idx.get(b.edge.source) || 0);
          if (d) return d;
          d = (idx.get(a.edge.target) || 0) - (idx.get(b.edge.target) || 0);

    var gx = left ? clampX(Math.min(ax, bx) - depth) : clampX(Math.max(ax + aw, bx + bw) + depth);

    var stub = Math.max(8, Math.min(18, gap * 0.22));

  }

        var path = raw.split("/").map(normSeg).filter(Boolean).join("/");
        if (!path) { toast("ID に使える名前がありません"); return; }
        var id = side + ":" + subv + "/" + path;
        var meta = {};
        meta[side === "store" ? "storeKind" : "boundaryKind"] = subv;
        if (fields.note.value.trim()) meta.note = fields.note.value.trim();
        var annNode = { id: id, kind: side, name: raw, metadata: meta };
        var relKind = rel.value;
        if (side === "boundary" && relKind !== "invokes") relKind = "invokes";
        if (side === "store" && relKind === "invokes") relKind = "writes";
        var edge = { source: n.id, target: id, kind: relKind, confidence: readConf(fields, 0.8) };
        if (fields.note.value.trim()) edge.note = fields.note.value.trim();
        var existed = state.byId.has(id);
        addAnnNode(annNode);
        addAnnEdge(edge);
        saveAndApply({ nodes: [annNode], edges: [edge] },
          existed ? "既存ノード " + id + " に寄せ、縁だけ追加しました" : "ノード " + id + " を追加しました");
      } }, "保存"));
  }
  // ---------- 注釈フォーム c) メタデータ ----------
  function formMeta(n) {
    var k = el("input", { type: "text", id: "meta-key", placeholder: "key（例: owner / reviewed_at）" });
    var v = el("input", { type: "text", id: "meta-value", placeholder: "value（例: orders-team）" });
    return el("details", { class: "ann", id: "form-meta" },
      el("summary", {}, "c) メタデータをこのノードへ"),
      el("div", { class: "row" }, k, v),
      el("div", { class: "hint" }, "既存の key とぶつかる場合は既存の値を残します（上書きしません）。"),
      el("button", { class: "btn primary small", id: "btn-save-meta", onclick: function () {
        var key = k.value.trim(), val = v.value.trim();
        if (!key) { toast("key を入れてください"); return; }
        if (!val) { toast("value を入れてください"); return; }
        var match = { kind: n.kind, id: n.id };
        var set = {};
        set[key] = val;
        addAnnMeta(match, set);
        var existed = (n.metadata || {})[key] !== undefined;
        saveAndApply({ metadata: [{ match: match, set: set }] },
          existed ? "既存の " + key + " を残したため表示は変わりません（注釈としては保存）" : "メタデータを保存しました");
      } }, "保存"));
  }

  // ---------- ノード未選択時: フロー一覧の統計サマリ ----------
  function summaryBlock() {
    var box = el("div", { id: "detail-summary" });
    box.appendChild(el("div", { class: "dt-name" }, "サマリー"));
    box.appendChild(el("div", { class: "hint" }, "ノードを選ぶと詳細がここに表示されます（表・カード・グラフのクリックで選択）。"));
    box.appendChild(el("div", { class: "sec-title" }, "フロー一覧"));
    var t = el("table", { class: "grid" });
    t.appendChild(el("thead", {}, el("tr", {},
      el("th", {}, "フロー"),
      el("th", { title: "ステップ数" }, "手数"),
      el("th", { title: "reads / writes / invokes が 0 のステップ" }, "未記"),
      el("th", { title: "reads 縁" }, "読"),
      el("th", { title: "writes 縁" }, "書"),
      el("th", { title: "invokes 縁" }, "呼"),
      el("th", { title: "未紐づけ候補ノード" }, "候補"))));
    var tb = el("tbody");
    flows().forEach(function (f) {
      var steps = flowSteps(f);
      var counts = { reads: 0, writes: 0, invokes: 0, empty: 0 };
      steps.forEach(function (st) {
        if (isGateway(st.node)) return; // gateway は I/O 対象外（分岐だけを持つ通過点）
        var io = 0;
        outsOf(st.id).forEach(function (e) {
          if (e.kind === "reads") { counts.reads++; io++; }
          else if (e.kind === "writes") { counts.writes++; io++; }
          else if (e.kind === "invokes") { counts.invokes++; io++; }
        });
        if (io === 0) counts.empty++;
      });
      var cands = state.vis.nodes.filter(function (m) {
        return (m.kind === "store" || m.kind === "boundary") && isUnlinked(m);
      }).length;
      tb.appendChild(el("tr", { dataset: { node: f.id }, onclick: function () { state.flowId = f.id; selectNode(f.id); } },
        el("td", {}, el("b", {}, f.name), el("div", { class: "sr-id" }, f.id)),
        el("td", {}, String(steps.length)),
        el("td", {}, counts.empty ? el("span", { class: "badge empty-io" }, counts.empty) : el("span", { class: "dim" }, "0")),
        el("td", {}, String(counts.reads)), el("td", {}, String(counts.writes)), el("td", {}, String(counts.invokes)),
        el("td", {}, String(cands))));
    });
    if (!tb.childNodes.length) tb.appendChild(el("tr", {}, el("td", { class: "dim" }, "フローがありません")));
    t.appendChild(tb);
    box.appendChild(t);

    box.appendChild(el("div", { class: "sec-title" }, "内訳"));
    var byKind = {}, byEdge = {}, byProv = {};
    state.vis.nodes.forEach(function (n) { byKind[n.kind] = (byKind[n.kind] || 0) + 1; byProv[nodeProvenance(n)] = (byProv[nodeProvenance(n)] || 0) + 1; });
    state.vis.edges.forEach(function (e) { byEdge[e.kind] = (byEdge[e.kind] || 0) + 1; });
    var kv = el("table", { class: "kv" });
    kv.appendChild(el("tr", {}, el("td", { class: "k" }, "ノード種別"),
      el("td", { class: "v" }, KINDS.filter(function (k) { return byKind[k]; }).map(function (k) { return KIND_LABEL[k] + " " + byKind[k]; }).join(" / ") || "—")));
    kv.appendChild(el("tr", {}, el("td", { class: "k" }, "出所"),
      el("td", { class: "v" }, PROV_KINDS.filter(function (p) { return byProv[p]; }).map(function (p) { return PROV_LABEL[p] + " " + byProv[p]; }).join(" / ") || "—")));
    kv.appendChild(el("tr", {}, el("td", { class: "k" }, "縁"),
      el("td", { class: "v" }, Object.keys(byEdge).sort().map(function (k) { return k + " " + byEdge[k]; }).join(" / ") || "—")));
    kv.appendChild(el("tr", {}, el("td", { class: "k" }, "未紐づけ"),
      el("td", { class: "v" }, String(state.vis.nodes.filter(isUnlinked).length) + " ノード")));
    box.appendChild(kv);

    if (state.graph.warnings && state.graph.warnings.length) {
      box.appendChild(el("div", { class: "sec-title" }, "マージ警告"));
      var w = el("div");
      state.graph.warnings.forEach(function (m) { w.appendChild(el("div", { class: "ev-row" }, m)); });
      box.appendChild(w);
    }
    return box;
  }

  // ==========================================================
  //  起動
  // ==========================================================
  var views = { flow: flowView, graph: graphView, stores: storeView, io: ioView, code: codeView };
  var rawDataJson = "";

  function fatal(msg) {
    var host = document.getElementById("views");
    clear(host);
    host.appendChild(el("div", { id: "fatal" }, "グラフデータを読めません: " + msg));
  }

  function boot() {
    var holder = document.getElementById("graph-data");
    rawDataJson = holder ? String(holder.textContent || "").trim() : "";
    var graph;
    try {
      graph = JSON.parse(rawDataJson);
    } catch (e) {
      fatal("JSON パース失敗 — " + e.message);
      return;
    }
    if (typeof graph !== "object" || graph === null) {
      fatal("render.mjs でデータが埋め込まれていません（node bin/render.mjs ... で生成してください）");
      return;
    }
    state.graph = graph;
    if (!Array.isArray(state.graph.nodes)) state.graph.nodes = [];
    if (!Array.isArray(state.graph.edges)) state.graph.edges = [];
    if (!Array.isArray(state.graph.warnings)) state.graph.warnings = [];
    state.graph.nodes.forEach(function (n) { if (!n.metadata) n.metadata = {}; });
    reindex();

    // localStorage の人注釈を反映（既存優先）
    state.ann = loadAnn();
    var logs = applyAnnDoc(state.ann);
    reindex();
    state.flowId = primaryFlow();
    applyHash();
    applyTheme();   // data-theme を先に決める（hash の theme= は保存値より優先）
    $("#btn-theme").addEventListener("click", cycleTheme);
    try {
      var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
      var onMq = function () { if (themeMode === "system") applyTheme(); };
      if (mq && mq.addEventListener) mq.addEventListener("change", onMq);
      else if (mq && mq.addListener) mq.addListener(onMq);
    } catch (e) { /* matchMedia が無い環境は初期状態のまま */ }

    // --- ヘッダ / タブのイベント ---
    Object.keys(views).forEach(function (k) { views[k].ensure(); });
    Array.prototype.forEach.call(document.querySelectorAll(".tab-btn"), function (b) {
      b.addEventListener("click", function () { setView(b.dataset.view); });
    });
    $("#chip-unlinked").addEventListener("click", function () {
      state.filters.unlinked = !state.filters.unlinked;
      refresh();
    });
    $("#btn-reset-filter").addEventListener("click", function () {
      state.filters.kinds = new Set(KINDS);
      state.filters.provs = new Set(PROV_KINDS);
      state.filters.unlinked = false;
      refresh();
      toast("フィルタを解除しました");
    });
    $("#flow-select").addEventListener("change", function (ev) {
      state.flowId = ev.target.value;
      writeHash();
      refresh();
    });
    var si = $("#search-input");
    si.addEventListener("input", function () { runSearch(si.value); });
    si.addEventListener("focus", function () { if (si.value) runSearch(si.value); });
    si.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") {
        var first = document.querySelector("#search-results .sr-item");
        if (first) { selectNode(first.dataset.node); $("#search-results").classList.remove("open"); }
      } else if (ev.key === "Escape") {
        $("#search-results").classList.remove("open");
      }
    });
    document.addEventListener("click", function (ev) {
      if (!ev.target.closest || !ev.target.closest(".search-wrap")) $("#search-results").classList.remove("open");
    });
    $("#btn-export").addEventListener("click", exportAnn);
    $("#btn-clear-ann").addEventListener("click", clearAnn);
    $("#btn-share").addEventListener("click", function () {
      var url = shareUrl();
      this.setAttribute("data-url", url);
      copyText(url, "共有 URL をコピーしました");
    });
    window.addEventListener("hashchange", function () {
      if (suppressingHash) return;
      applyHash();
      applyTheme();   // hash の theme= でも切り替わる
      refresh();
      setView(state.view, true);
      renderDetail();
    });

    logs = logs || [];
    logs.forEach(function (l) { console.info("[注釈] " + l); });
    refresh();
    setView(state.view, true);
    writeHash();
    if (storage.available === false) toast("localStorage を使えないため、注釈はこのページ内に限り保持されます");
    if (logs.length) console.info("ローカル注釈を " + logs.length + " 件反映しました");
  }

  // テストと手動確認用の小さなフック（描画ロジックは DOM 経由で検証できる）
  window.__flowViewer = {
    state: state,
    views: views,
    graphView: graphView,
    flowView: flowView,
    visualEnds: visualEnds,
    setView: setView,
    selectNode: selectNode,
    shareUrl: shareUrl,
  };
  boot();
})();
</script>
</body>
</html>
